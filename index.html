async function doAccountLogin(){
  const ident = ($('#compteIdent')?.value||'').trim();
  const pwd = ($('#comptePwd')?.value||'').trim();
  const identLower = ident.toLowerCase();
  if(!ident || !pwd){ toast(t('required_fields'),'error'); return; }

  /* 1. Admin */
  if(identLower === DB.admin.username.toLowerCase() && await verifyPassword(pwd, DB.admin.password)){
    if(!/^[0-9a-f]{64}$/i.test(DB.admin.password)){
      DB.admin.password = await hashPassword(pwd);
    }
    state.admin = {username: DB.admin.username};
    state.doctor = null;
    state.clinic = null;
    state.role = 'admin';
    state.view = 'adash';
    state.recetteUnlocked = false;
    state.clinicRecetteUnlocked = false;
    state.msgTab = 'inbox'; state.msgOpenId = null;
    state.composeData = {to:'', subject:'', body:'', files:[], toSearch:''};
    state.msgSelected = [];
    state.selectedAppts = [];
    hideSubscriptionExpiredModal();
    saveDB();
    render();
    toast(t('account_admin_welcome') + ' ✓','success');
    return;
  }

  /* 2. Clinique */
  let clinicFound = null;
  for(const c of DB.clinics){
    const okIdent = (String(c.email).toLowerCase() === identLower || String(c.name).toLowerCase() === identLower);
    if(okIdent && await verifyPassword(pwd, c.password)){ clinicFound = c; break; }
  }
  if(clinicFound){
    if(!/^[0-9a-f]{64}$/i.test(clinicFound.password)){
      clinicFound.password = await hashPassword(pwd);
      saveDB();
    }
    if(clinicFound.locked){
      showClinicLockedModal();
      return;
    }
    state.clinic = clinicFound;
    state.doctor = null;
    state.admin = null;
    state.role = 'clinic';
    state.view = 'cdash';
    state.recetteUnlocked = false;
    state.clinicRecetteUnlocked = false;
    state.msgTab = 'inbox'; state.msgOpenId = null;
    state.composeData = {to:'', subject:'', body:'', files:[], toSearch:''};
    state.msgSelected = [];
    state.selectedAppts = [];
    state.clinicData.tab = 'dashboard';
    state.urgenceAlertShown = [];
    if(isClinicSubscriptionType(clinicFound) && !isClinicSubscriptionActive(clinicFound)){
      render();
      showClinicSubscriptionExpiredModal();
      return;
    }
    hideSubscriptionExpiredModal();
    render();
    toast(t('account_clinic_welcome') + ' ✓','success');
    setTimeout(()=>{ checkNewEmergenciesForClinic(); }, 800);
    return;
  }

  /* 3. Médecin */
  let doc = null;
  for(const d of DB.doctors){
    const okIdent = (String(d.email).toLowerCase() === identLower || String(d.name).toLowerCase() === identLower);
    if(okIdent && await verifyPassword(pwd, d.password)){ doc = d; break; }
  }
  if(doc){
    if(!/^[0-9a-f]{64}$/i.test(doc.password)){
      doc.password = await hashPassword(pwd);
      saveDB();
    }
    if(doc.locked){
      showDoctorLockedModal();
      return;
    }
    state.doctor = doc;
    state.admin = null;
    state.clinic = null;
    state.role = 'doctor';
    state.view = 'ddash';
    state.recetteUnlocked = false;
    state.clinicRecetteUnlocked = false;
    state.msgTab = 'inbox'; state.msgOpenId = null;
    state.composeData = {to:'', subject:'', body:'', files:[], toSearch:''};
    state.msgSelected = [];
    state.selectedAppts = [];
    if(!state.internalForm.date && isWorkDay(doc, todayISO())){
      state.internalForm.date = todayISO();
    }
    if(isSubscriptionType(doc) && !isSubscriptionActive(doc)){
      render();
      showSubscriptionExpiredModal();
      return;
    }
    hideSubscriptionExpiredModal();
    render();
    toast(t('account_doctor_welcome') + ' ✓','success');
    return;
  }

  if(view === 'home'){

      patientName:'',patientPhone:'',patientEmail:'',patientWilaya:'',patientPassword:'',motif:''};

    'clinicView','clinicBook','clinicProfile'];
  if(accountViews.includes(view) && !state.doctor && !state.admin && !state.clinic){

  if(view === 'drecette' && state.doctor && !state.recetteUnlocked){

    state.clinicData.clinicApptFilter.date = todayISO();
  }
  if(view === 'dinternal' && state.doctor && !state.internalForm.date){

  state.view = view; state.apptsPage = 1;
  state.msgSelected = [];

function filterDoctorsForSearch(){
  const q = (state.search.q||'').trim().toLowerCase();
  const spec = state.search.specialty || '';
  const wilaya = state.search.wilaya || '';
  const commune = state.search.commune || '';
  return DB.doctors.filter(d=>{
    if(isDoctorHiddenFromPatients(d)) return false;
    if(spec && d.specialty!==spec) return false;
    if(wilaya && d.wilaya!==wilaya) return false;
    if(commune && d.commune!==commune) return false;
    if(!q) return true;
    const hay = `${d.name} ${d.specialty} ${d.wilaya} ${d.commune}`.toLowerCase();
    return hay.includes(q);
  });
}
function filterClinicsForSearch(){
  const q = (state.search.q||'').trim().toLowerCase();
  const wilaya = state.search.wilaya || '';
  const commune = state.search.commune || '';
  return DB.clinics.filter(c=>{
    if(isClinicHiddenFromPatients(c)) return false;
    if(wilaya && c.wilaya!==wilaya) return false;
    if(commune && c.commune!==commune) return false;
    if(!q) return true;
    const svcNames = clinicServicesFor(c.id).map(s=>s.name).join(' ');
    const prestNames = clinicPrestationsFor(c.id).map(p=>p.name).join(' ');
    const docNames = clinicLinkedDoctors(c.id).map(d=>d.name+' '+d.specialty).join(' ');
    const hay = `${c.name} ${c.description||''} ${c.wilaya} ${c.commune} ${svcNames} ${prestNames} ${docNames}`.toLowerCase();
    return hay.includes(q);
  });
}

function renderRecentPagination(page, totalPages, totalItems){
  const maxBtns = 5;
  let start = Math.max(1, page - 2);
  let end = Math.min(totalPages, start + maxBtns - 1);
  if(end - start < maxBtns - 1) start = Math.max(1, end - maxBtns + 1);
  const btns = [];
  if(start > 1) btns.push(`<button class="page-btn" onclick="state.recentPage=1;render()">1</button>`, start>2?`<span class="page-info">…</span>`:'');
  for(let p=start; p<=end; p++) btns.push(`<button class="page-btn ${p===page?'active':''}" onclick="state.recentPage=${p};render()">${p}</button>`);
  if(end < totalPages) btns.push(end<totalPages-1?`<span class="page-info">…</span>`:'', `<button class="page-btn" onclick="state.recentPage=${totalPages};render()">${totalPages}</button>`);
  return `
    <div class="pagination" style="margin-top:12px">
      <button class="page-btn" ${page===1?'disabled':''} onclick="state.recentPage=${page-1};render()">‹</button>
      ${btns.join('')}
      <button class="page-btn" ${page===totalPages?'disabled':''} onclick="state.recentPage=${page+1};render()">›</button>
      <span class="page-info">${page} / ${totalPages} · ${totalItems}</span>
    </div>
  `;
}

/* ---------------- SON D'ALERTE ---------------- */
function startUrgenceSound(){
  if(!state.urgenceSoundEnabled) return;
  try {
    stopUrgenceSound();
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if(!AudioCtx) return;
    const ctx = new AudioCtx();
    state.urgenceAlertAudioCtx = ctx;
    const beep = () => {
      if(!state.urgenceAlertAudioCtx) return;
      try{
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = 880;
        gain.gain.setValueAtTime(0.0001, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.35, ctx.currentTime + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.35);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(ctx.currentTime);
        osc.stop(ctx.currentTime + 0.4);
      }catch(e){}
    };
    beep();
    state.urgenceAlertInterval = setInterval(beep, 900);
  } catch(e){ console.warn('Audio error', e); }
}
function stopUrgenceSound(){
  if(state.urgenceAlertInterval){
    clearInterval(state.urgenceAlertInterval);
    state.urgenceAlertInterval = null;
  }
  if(state.urgenceAlertAudioCtx){
    try { state.urgenceAlertAudioCtx.close(); }catch(e){}
    state.urgenceAlertAudioCtx = null;
  }
}
function toggleUrgenceSound(){
  state.urgenceSoundEnabled = !state.urgenceSoundEnabled;
  saveUrgenceSound();
  if(!state.urgenceSoundEnabled) stopUrgenceSound();
  else if(state.urgencePopupOpen) startUrgenceSound();
  render();
  toast(state.urgenceSoundEnabled ? t('urgence_sound_on') : t('urgence_sound_off'), 'info');
}

/* MODIF #2 : regroupement par date + étiquettes compactes */
function renderUrgencesGroupedByDate(list, kind){
  if(!list.length) return '';
  const groups = {};
  list.forEach(e => {
    const d = String(e.createdAt || nowISO()).slice(0,10);
    if(!groups[d]) groups[d] = [];
    groups[d].push(e);
  });
  const sortedDates = Object.keys(groups).sort((a,b)=> b.localeCompare(a));
  const today = todayISO();
  const yesterday = dateOffset(-1);
  return sortedDates.map(date => {
    let label;
    if(date === today) label = "Aujourd'hui";
    else if(date === yesterday) label = "Hier";
    else label = fmtLongDate(date);
    return `
      <div class="urgence-date-header">
        <span class="udh-ico">📅</span>
        <span class="udh-lbl">${esc(label)}</span>
        <span class="udh-count">${groups[date].length}</span>
      </div>

/* MODIF #3 : ajout bouton valider la commission dans le détail */
function openUrgenceDetailClinic(id){
  const e = DB.emergencies.find(x=>x.id===id);
  if(!e) return;
  const typeLabels = (e.emergencyType||'').split(',').map(id => {

      <div class="ic-item"><div class="ic-lbl">🗺️ ${t('wilaya')}</div><div class="ic-val">${esc(e.patientWilaya)}</div></div>
      <div class="ic-item"><div class="ic-lbl">🎂 ${t('age')}</div><div class="ic-val">${e.patientAge ? e.patientAge+' ans' : '—'}</div></div>
      <div class="ic-item" style="grid-column:1/-1"><div class="ic-lbl">🚨 ${t('urgence_type')}</div><div class="ic-val wrap">${typeLabels.map(tp=>`<span class="tag danger" style="margin:2px">${tp.ico} ${esc(tp.label)}</span>`).join(' ')}</div></div>
      <div class="ic-item" style="grid-column:1/-1"><div class="ic-lbl">📅 ${t('when')}</div><div class="ic-val">${created}</div></div>
      ${e.description ? `<div class="ic-item" style="grid-column:1/-1"><div class="ic-lbl">📝 ${t('urgence_description')}</div><div class="ic-val wrap" style="font-style:italic">"${esc(e.description)}"</div></div>` : ''}
      ${e.clinicResponse ? `<div class="ic-item" style="grid-column:1/-1"><div class="ic-lbl">💬 ${t('urgence_response_msg')}</div><div class="ic-val wrap">${esc(e.clinicResponse)}</div></div>` : ''}
      ${validated ? `
        <div class="ic-item" style="grid-column:1/-1;background:linear-gradient(135deg,rgba(16,185,129,.12),rgba(16,185,129,.04));border-color:rgba(16,185,129,.4)">
          <div class="ic-lbl" style="color:#059669">✅ ${t('urgence_validated_badge')}</div>
          <div class="ic-val" style="color:#059669;font-weight:800">${e.validatedAt ? new Date(e.validatedAt).toLocaleString('fr-FR') : ''}</div>
          ${isCommissionMode ? `<div style="font-size:11px;color:#059669;margin-top:4px;font-weight:600">💰 ${t('urgence_commission_label')} : ${n2(comm)} DA</div>` : ''}
        </div>
      ` : ''}
    </div>
    ${e.assignedClinicName ? `<div class="letter-amount" style="font-style:normal;margin-top:10px">🏥 <strong>${esc(e.assignedClinicName)}</strong> — ${e.status === 'accepted' ? '✅ ' + t('urgence_status_accepted') : '🚫 ' + t('urgence_status_declined')}</div>` : ''}
  `;
  let actions = `<button class="pill-btn" onclick="closeModal()">${t('close')}</button>`;
  if(isPending){
    actions = `
      <button class="pill-btn danger" onclick="closeModal();if(state.clinic){const e=DB.emergencies.find(x=>x.id==='${id}');showEmergencyPopup(e);}">🔔 ${t('urgence_respond')}</button>
      <button class="pill-btn" onclick="closeModal()">${t('close')}</button>
    `;
  } else if(isMineAccepted && !validated){
    /* MODIF #3 : bouton valider visible si acceptée par la clinique et non encore validée */
    actions = `
      <button class="pill-btn success" onclick="askValidateUrgence('${id}')">✅ ${t('urgence_validate')}${isCommissionMode ? ` (+${n2(comm)} DA)` : ''}</button>
      <button class="pill-btn" onclick="closeModal()">${t('close')}</button>
    `;
  }
  openModal('🚨 ' + t('urgence_details'), e.patientName, body, actions, true);
}
/* MODIF #3 : validation de l'urgence → comptabilise la commission */
function askValidateUrgence(id){
  const e = DB.emergencies.find(x=>x.id===id);
  if(!e) return;
  if(!state.clinic){ toast('Vous devez être connecté en tant que clinique','error'); return; }
  if(String(e.assignedClinicId) !== String(state.clinic.id)){
    toast('Seule la clinique assignée peut valider cette urgence','error');
    return;
  }
  if(isUrgenceValidated(e)){ toast(t('urgence_validated_badge'),'info'); return; }
  const comm = urgenceClinicCommission(e);
  const clinicObj = clinicById(e.assignedClinicId);
  const billing = clinicObj ? getClinicBilling(clinicObj) : null;
  const isCommissionMode = billing && billing.type === 'commission';
  openModal('✅ ' + t('urgence_validate'),
    t('urgence_validate_confirm'),
    `<div style="font-size:13px;line-height:1.8">
      <div><strong>${t('patient')} :</strong> ${esc(e.patientName)}</div>
      <div><strong>${t('when')} :</strong> ${new Date(e.createdAt||nowISO()).toLocaleString('fr-FR')}</div>
      ${isCommissionMode ? `<div style="margin-top:8px;padding:10px 12px;background:var(--success-bg);border-radius:8px;border-left:3px solid var(--success);color:#059669;font-weight:700">💰 ${t('urgence_commission_label')} : ${n2(comm)} DA</div>` : `<div style="margin-top:8px;font-size:12px;color:var(--text-muted);font-style:italic">${t('urgence_no_commission_note')}</div>`}
    </div>`,
    `<button class="pill-btn" onclick="closeModal()">${t('cancel')}</button>
     <button class="pill-btn success" onclick="doValidateUrgence('${id}')">✅ ${t('urgence_validate')}</button>`);
}
function doValidateUrgence(id){
  const e = DB.emergencies.find(x=>x.id===id);
  if(!e) return;
  if(!state.clinic){ toast('Vous devez être connecté en tant que clinique','error'); return; }
  if(String(e.assignedClinicId) !== String(state.clinic.id)){ toast('Accès refusé','error'); return; }
  e.validatedAt = nowISO();
  e.updatedAt = nowISO();
  saveDB();
  closeModal();
  render();
  toast('✅ ' + t('urgence_validated_ok'),'success');
}

function formatDuration(minutes){
  if(minutes <= 0) return t('queue_shortly');
  if(minutes <= 5) return t('queue_shortly');
  if(minutes < 60){
    return minutes === 1
      ? t('queue_minute').replace('{n}', 1)
      : t('queue_minutes').replace('{n}', minutes);
  }
  const h = Math.floor(minutes / 60);
  const m = minutes % 60;
  const hStr = h === 1
    ? t('queue_hour').replace('{n}', 1)
    : t('queue_hours').replace('{n}', h);
  if(m === 0) return hStr;
  const mStr = m === 1
    ? t('queue_minute').replace('{n}', 1)
    : t('queue_minutes').replace('{n}', m);
  return hStr + ' ' + t('queue_and') + ' ' + mStr;
}

function toggleBookingService(serviceId, checked){
  if(!state.booking.services) state.booking.services = [];
  const idx = state.booking.services.indexOf(serviceId);
  if(checked && idx < 0) state.booking.services.push(serviceId);
  else if(!checked && idx >= 0) state.booking.services.splice(idx, 1);
  render();
}
async function confirmBooking(){
  const s = state.booking;
  const name = ($('#pName')?.value||'').trim();
  const age = parseInt($('#pAge')?.value,10);
  const phone = ($('#pPhone')?.value||'').trim();
  const email = ($('#pEmail')?.value||'').trim();
  const motif = ($('#pMotif')?.value||'').trim();
  const patientWilaya = ($('#pWilaya')?.value||'').trim();
  const patientPassword = ($('#pPassword')?.value||'').trim();
  const hashedPatientPwd = patientPassword ? await hashPassword(patientPassword) : '';
  if(!name || !phone){ toast(t('required_fields'),'error'); return; }
  const doc = docById(s.doctorId);
  if(!doc){ toast(t('doctor_not_found'),'error'); return; }
  const selectedServices = (s.services||[]).map(id => {
    const sv = serviceById(id);
    return sv ? {id:sv.id, name:sv.name, price:sv.price} : null;
  }).filter(Boolean);
  const servicesTotal = selectedServices.reduce((sum,sv)=>sum+sv.price, 0);
  const savedDocs = await saveApptDocuments(s.documents || []);

  if(s.editingId){
    const a = DB.appointments.find(x=>x.id===s.editingId);
    if(!a){
      toast(t('appt_not_found'),'error');
      state.booking = {doctorId:null,date:null,time:null,step:1,patientAge:'',editingId:null,services:[],documents:[],
        patientName:'',patientPhone:'',patientEmail:'',patientWilaya:'',patientPassword:'',motif:''};
      state.view = 'my';
      render();
      return;
    }
    const clash = DB.appointments.find(x=>x.id!==s.editingId && String(x.doctorId)===String(doc.id) && x.date===s.date && x.time===s.time && x.status!=='cancelled' && x.status!=='deleted');
    if(clash){ toast(t('slot_taken'),'error'); return; }
    a.doctorId = doc.id;
    a.date = s.date; a.time = s.time;
    a.patientName = name;
    a.patientAge = isNaN(age) ? null : age;
    a.patientPhone = phone;
    a.patientEmail = email;
    a.patientWilaya = patientWilaya;
    a.patientPassword = hashedPatientPwd;
    a.motif = motif || 'Consultation';
    a.services = selectedServices;
    a.servicesTotal = servicesTotal;
    a.documents = savedDocs;
    a.status = 'pending';
    a.updatedAt = nowISO();
    clearApptNotifications(a.id);
    pushNotif('doctor','RDV modifié', `${name} — ${fmtDate(s.date)} ${s.time}`, doc.id, a.id);
    pushNotif('patient','RDV modifié', `RDV ${a.id} mis à jour`, null, a.id);
    state.myPhone = phone; localStorage.setItem('omnimed_phone', phone);
    state.booking = {doctorId:null,date:null,time:null,step:1,patientAge:'',editingId:null,services:[],documents:[],
      patientName:'',patientPhone:'',patientEmail:'',patientWilaya:'',patientPassword:'',motif:''};
    saveDB();
    state.view = 'my';
    render();
    toast(t('modified_ok'),'success');
    return;
  }

  const clash = DB.appointments.find(x=>String(x.doctorId)===String(doc.id) && x.date===s.date && x.time===s.time && x.status!=='cancelled' && x.status!=='deleted');
  if(clash){ toast(t('slot_just_taken'),'error'); s.step=2; render(); return; }
  const appt = {
    id: genApptId(),
    doctorId:doc.id, patientName:name,
    patientAge: isNaN(age) ? null : age, patientPhone:phone, patientEmail:email,
    patientWilaya: patientWilaya,
    patientPassword: hashedPatientPwd,
    date:s.date, time:s.time, motif:motif||'Consultation',
    services: selectedServices, servicesTotal: servicesTotal,
    documents: savedDocs,
    status:'pending', createdAt:nowISO(), reminders:{h2:false}, notes:'', internal:false, rating:0,
    clinicId: null, clinicServiceId: null, prestationId: null, apptType: 'cabinet', clinicRating: 0
  };
  DB.appointments.push(appt);
  state.myPhone = phone; localStorage.setItem('omnimed_phone', phone);
  pushNotif('doctor','Nouvelle demande de RDV', `${name} — ${fmtDate(s.date)} ${s.time}`, doc.id, appt.id);
  pushNotif('patient','Demande envoyée', `En attente de validation par ${doc.name}`, null, appt.id);
  saveDB();
  state.booking.step = 4;
  state.booking.lastId = appt.id;
  render();
}

async function verifyPatientPwd(apptId, action){
  const v = ($('#patientPwdCheck')?.value||'');
  const a = DB.appointments.find(x=>x.id===apptId);
  if(!a){ closeModal(); return; }
  const stored = a.patientPassword || '';
  if(stored && await verifyPassword(v, stored)){
    if(!/^[0-9a-f]{64}$/i.test(stored)){
      a.patientPassword = await hashPassword(v);
      saveDB();
    }
    closeModal();
    if(action === 'modify') modifyAppt(apptId);
    else if(action === 'cancel') patientCancel(apptId);
  } else {
    toast(t('wrong_password'),'error');
  }
}

function queueInfoFor(a){
  const today = todayISO();
  const now = new Date();
  if(a.date !== today){
    return {
      mode:'future',
      text: t('queue_future').replace('{date}', fmtDateFR(a.date)).replace('{time}', a.time)
    };
  }
  const apptDT = new Date(a.date + 'T' + a.time + ':00');
  const diffMs = apptDT - now;
  const diffMin = Math.round(diffMs / 60000);
  const nowTime = String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  const earlierCount = DB.appointments.filter(x =>
    x.doctorId && String(x.doctorId) === String(a.doctorId) && x.date === a.date && x.id !== a.id &&
    (x.status === 'pending' || x.status === 'confirmed') &&
    x.time < a.time &&
    x.time >= nowTime
  ).length;
  if(diffMin <= 0){
    return {
      mode:'passed',
      text: t('queue_passed').replace('{time}', a.time),
      patientsAhead: earlierCount
    };
  }
  const whenStr = formatDuration(diffMin);
  return {
    mode:'today',
    text: t('queue_today').replace('{when}', whenStr).replace('{time}', a.time),
    patientsAhead: earlierCount
  };
}
function hoverStars(btn){
  const widget = btn.parentElement;
  const buttons = Array.from(widget.querySelectorAll('button'));
  const idx = buttons.indexOf(btn);
  buttons.forEach((b, i) => {
    if(i <= idx) b.classList.add('hover');
    else b.classList.remove('hover');
  });
}

function renderPagination(page, totalPages, totalItems){
  const maxBtns = 7;
  let start = Math.max(1, page - 3);
  let end = Math.min(totalPages, start + maxBtns - 1);
  if(end - start < maxBtns - 1) start = Math.max(1, end - maxBtns + 1);
  const btns = [];
  if(start > 1) btns.push(`<button class="page-btn" onclick="state.apptsPage=1;render()">1</button>`, start>2?`<span class="page-info">…</span>`:'');
  for(let p=start; p<=end; p++) btns.push(`<button class="page-btn ${p===page?'active':''}" onclick="state.apptsPage=${p};render()">${p}</button>`);
  if(end < totalPages) btns.push(end<totalPages-1?`<span class="page-info">…</span>`:'', `<button class="page-btn" onclick="state.apptsPage=${totalPages};render()">${totalPages}</button>`);
  return `
    <div class="pagination">
      <button class="page-btn" ${page===1?'disabled':''} onclick="state.apptsPage=${page-1};render()">‹</button>
      ${btns.join('')}
      <button class="page-btn" ${page===totalPages?'disabled':''} onclick="state.apptsPage=${page+1};render()">›</button>
      <span class="page-info">${page} / ${totalPages} · ${totalItems}</span>
    </div>
  `;
}

function doConfirmApptWithNotify(id){

function confirmDoctorAction(id, action){
  const a = DB.appointments.find(x=>x.id===id); if(!a) return;
  if(action === 'done' && !canValidateAppt(a)){
    toast(validationBlockedMsg(a), 'error');
    return;
  }
  const doc = docById(a.doctorId);
  const titles = {
    cancel: t('confirm_cancel_doctor'),
    done: t('confirm_validate')
  };
  const btnClass = {cancel:'danger', done:'primary'};
  const btnLabel = {cancel: '✕ '+t('cancel'), done: '✓ '+t('validate')};
  openModal(titles[action], `${a.patientName} — ${fmtLongDate(a.date)} ${a.time}`,
    `<div style="font-size:13px;line-height:1.7">
       <div><strong>${t('patient')} :</strong> ${esc(a.patientName)}</div>
       <div><strong>${t('doctor')} :</strong> ${esc(doc?.name||'—')}</div>
       <div><strong>${t('motif')} :</strong> ${esc(a.motif||'—')}</div>
     </div>`,
    `<button class="pill-btn" onclick="closeModal()">${t('close')}</button>
     <button class="pill-btn ${btnClass[action]}" onclick="docAction('${id}','${action}')">${btnLabel[action]}</button>`);
}
function docAction(id, action){
  const a = DB.appointments.find(x=>x.id===id); if(!a) return;
  const doc = docById(a.doctorId); if(!doc) return;
  if(action === 'done' && !canValidateAppt(a)){
    toast(validationBlockedMsg(a), 'error');
    closeModal();
    return;
  }
  if(action==='cancel'){
    a.status='cancelled';
    pushNotif('patient','RDV annulé', `Votre RDV ${a.id} a été annulé par le médecin`, null, a.id);
    toast('Rendez-vous annulé','info');
  } else if(action==='done'){
    a.status='done';
    pushNotif('patient','Consultation terminée', `Merci d'avoir consulté ${doc.name}`, null, a.id);
    toast('Rendez-vous validé - commission comptabilisée','success');
  }
  clearApptNotifications(a.id); saveDB();
  closeModal(); render();
}
function confirmDeleteAppt(id){
  const a = DB.appointments.find(x=>x.id===id); if(!a) return;
  if(state.role === 'doctor' && a.status === 'done'){ toast(t('cannot_delete_done'), 'error'); return; }

function deleteAppt(id){

function saveService(doctorId, serviceId){
  const name = ($('#svName')?.value||'').trim();
  const price = parseInt($('#svPrice')?.value,10) || 0;
  const desc = ($('#svDesc')?.value||'').trim();
  if(!name){ toast(t('required_fields'),'error'); return; }
  if(serviceId){

    sv.name = name; sv.price = price; sv.description = desc;
  } else {

  }
  saveDB();
  openServicesManager(doctorId);
  toast(t('saved_ok'),'success');
}

function toggleInternalService(serviceId, checked){
  if(!state.internalForm.services) state.internalForm.services = [];
  const idx = state.internalForm.services.indexOf(serviceId);
  if(checked && idx < 0) state.internalForm.services.push(serviceId);
  else if(!checked && idx >= 0) state.internalForm.services.splice(idx, 1);
  render();
}
async function createInternalAppt(){
  const doc = state.doctor;
  const f = state.internalForm;
  const name = (f.patientName||'').trim();
  const phone = (f.patientPhone||'').trim();
  const age = parseInt(f.patientAge,10);
  if(!name || !phone){ toast(t('required_fields'),'error'); return; }
  if(!f.date || !f.time){ toast(t('required_fields'),'error'); return; }
  const clash = DB.appointments.find(x=>String(x.doctorId)===String(doc.id) && x.date===f.date && x.time===f.time && x.status!=='cancelled' && x.status!=='deleted');
  if(clash){ toast(t('slot_taken'),'error'); return; }
  const selectedServices = (f.services||[]).map(id=>{
    const sv = serviceById(id);
    return sv ? {id:sv.id, name:sv.name, price:sv.price} : null;
  }).filter(Boolean);
  const servicesTotal = selectedServices.reduce((s,sv)=>s+sv.price,0);
  const savedDocs = await saveApptDocuments(f.documents || []);
  const appt = {
    id: genApptId(),
    doctorId:doc.id, patientName:name,
    patientAge: isNaN(age) ? null : age, patientPhone:phone, patientEmail: f.patientEmail||'',
    patientWilaya: f.patientWilaya||'',
    patientPassword: '',
    date:f.date, time:f.time, motif:f.motif||'Consultation interne',
    services: selectedServices, servicesTotal: servicesTotal,
    documents: savedDocs,
    status:'confirmed', createdAt:nowISO(), reminders:{h2:false}, notes:'', internal:true, rating:0,
    clinicId: null, clinicServiceId: null, prestationId: null, apptType: 'cabinet', clinicRating: 0
  };
  DB.appointments.push(appt);
  pushNotif('patient','RDV interne créé', `Votre RDV ${appt.id} le ${fmtDate(appt.date)} à ${appt.time}`, null, appt.id);
  saveDB();
  state.internalForm = {patientName:'', patientAge:'', patientPhone:'', patientEmail:'', date:'', time:'', motif:'', services:[], patientWilaya:'', documents:[]};
  render();
  toast(t('internal_saved'),'success');
}

function viewDossierList(mode){
  const isAdmin = mode === 'admin';
  let doctorId, doctorLabel = '';
  if(isAdmin){
    doctorId = state.dossier.adminDoctorId;
    if(doctorId !== 'all'){
      const d = docById(doctorId);
      doctorLabel = d ? d.name : '';
    }
  } else {
    doctorId = state.doctor ? state.doctor.id : null;
  }
  let allFiles;
  if(isAdmin && doctorId === 'all'){
    allFiles = DB.medicalFiles.slice();
  } else {
    allFiles = mfAllDossiersForDoctor(doctorId);
  }
  const q = (state.dossier.search||'').trim().toLowerCase();
  let filtered = allFiles.filter(f => {
    if(state.dossier.showArchived) return f.data && f.data.archived;
    return f.data && !f.data.archived;
  });
  if(q){
    const qn = normPhone(q);
    filtered = filtered.filter(f => {
      const name = (f.data.patientName||'').toLowerCase();
      if(name.includes(q)) return true;
      if(qn && normPhone(f.patientPhone).includes(qn)) return true;
      const aliases = (f.data.phoneAliases||[]);
      if(qn && aliases.some(a => normPhone(a).includes(qn))) return true;
      return false;
    });
  }
  filtered.sort((a,b)=>String(b.data?.updatedAt||'').localeCompare(String(a.data?.updatedAt||'')));
  const archivedCount = mfAllDossiersForDoctor(doctorId).filter(f=>f.data && f.data.archived).length;
  return `
    ${isAdmin ? `
    <div class="card" style="margin-bottom:14px">
      <div class="field" style="margin-bottom:0">
        <label>${t('filter_doctor')}</label>
        <select class="select" onchange="state.dossier.adminDoctorId=this.value;render()">
          <option value="all" ${state.dossier.adminDoctorId==='all'?'selected':''}>👥 ${t('billing_all_doctors')}</option>

        </select>
      </div>
    </div>` : ''}
    <div class="card" style="margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
        <div>
          <div class="card-title" style="font-size:16px">📁 ${t('dossiers_medical')} ${doctorLabel?`— ${esc(doctorLabel)}`:''} <span class="tag accent">${filtered.length}</span></div>
          <div class="card-sub" style="margin-bottom:0">${t('dossier_search_ph')}</div>
        </div>
        <div class="chips" style="margin:0">
          <button class="chip ${!state.dossier.showArchived?'active':''}" onclick="state.dossier.showArchived=false;render()">📂 ${t('dossiers_medical')}</button>
          <button class="chip ${state.dossier.showArchived?'active':''}" onclick="state.dossier.showArchived=true;render()">📦 ${t('dossier_archived_list')} <span class="tag muted" style="margin-left:4px">${archivedCount}</span></button>
        </div>
      </div>
      <div class="field" style="margin-top:12px;margin-bottom:0">
        <input class="input" id="dossierSearch" placeholder="🔎 ${t('dossier_search_ph')}" value="${esc(state.dossier.search||'')}" oninput="state.dossier.search=this.value;render()">
      </div>
    </div>
    ${filtered.length ? `
      <div class="grid grid-2">
        ${filtered.map(f => mfListCardHTML(f)).join('')}
      </div>
    ` : `<div class="empty" style="padding:40px"><div class="empty-ico">📁</div>${state.dossier.showArchived ? t('dossier_archived_list') + ' — ' + t('no_data_yet') : t('dossier_none')}</div>`}

            · 📞 ${esc(f.patientPhone||'—')}
          </div>
          ${state.role === 'admin' && doc ? `<div style="font-size:11px;color:var(--accent-primary);font-weight:600;margin-bottom:5px">🧑‍⚕️ ${esc(doc.name)}</div>` : ''}
          <div style="display:flex;gap:5px;flex-wrap:wrap;font-size:10.5px">
            ${counts.allergies > 0 ? `<span class="tag danger">⚠️ ${counts.allergies}</span>` : ''}
            ${counts.consultations > 0 ? `<span class="tag accent">📝 ${counts.consultations}</span>` : ''}
            ${counts.prescriptions > 0 ? `<span class="tag success">💊 ${counts.prescriptions}</span>` : ''}
            ${counts.vitals > 0 ? `<span class="tag muted">📊 ${counts.vitals}</span>` : ''}
          </div>
          ${(d.phoneAliases && d.phoneAliases.length) ? `
            <div style="margin-top:6px;font-size:10.5px;color:var(--text-muted)">
              🔗 ${t('phone_aliases')}: ${d.phoneAliases.map(a=>esc(a)).join(', ')}
            </div>
          ` : ''}
        </div>
      </div>
    </div>
  `;
}

function renderAdminView(){
  switch(state.view){
    case 'adash': return viewAdminDash();
    case 'adoctors': return viewAdminDoctors();
    case 'aclinics': return viewAdminClinics();
    case 'astats': return viewAdminStats();
    case 'arevenue': return viewAdminRevenue();
    case 'aappts': return viewAdminAppts();
    case 'aurgencies': return viewAdminUrgences();
    case 'alistes': return viewAdminListes();
    case 'asettings': return viewAdminSettings();
    case 'amessages': return renderMessagesView();
    case 'adossiers': return viewDossierList('admin');
    case 'dossier': return viewDossierSingle();
    default: return viewAdminDash();
  }
}
function viewAdminDash(){
  const totalDocs = DB.doctors.length;
  const totalClinics = DB.clinics.length;
  const activeAppts = DB.appointments.filter(a=>a.status!=='deleted');
  const totalAppts = activeAppts.length;
  const pending = activeAppts.filter(a=>a.status==='pending').length;
  const confirmed = activeAppts.filter(a=>a.status==='confirmed').length;
  const done = activeAppts.filter(a=>a.status==='done').length;
  const cancelled = activeAppts.filter(a=>a.status==='cancelled').length;
  const patients = new Set(activeAppts.map(a=>normPhone(a.patientPhone))).size;
  const todayAppts = activeAppts.filter(a=>a.date===todayISO() && a.status!=='cancelled');
  const docStats = DB.doctors.map(d=>({d, n: activeAppts.filter(a=>String(a.doctorId)===String(d.id)).length})).sort((a,b)=>b.n-a.n).slice(0,5);
  const billableList = activeAppts.filter(a=>a.status==='done');
  const totalRev = billableList.reduce((sum,a)=>sum+apptCommission(a)+apptClinicCommission(a),0);
  const todayRev = billableList.filter(a=>a.date===todayISO()).reduce((sum,a)=>sum+apptCommission(a)+apptClinicCommission(a),0);
  const commission = getGeneralCommission();
  const totalDossiers = DB.medicalFiles.length;
  const pendingUrg = (DB.emergencies||[]).filter(e => e.status === 'pending').length;
  const totalUrg = (DB.emergencies||[]).length;
  return `
    <div class="grid grid-4" style="margin-bottom:14px">
      <div class="stat"><div class="stat-ico">🧑‍⚕️</div><div><div class="stat-val">${totalDocs}</div><div class="stat-lbl">${t('total_doctors')}</div></div></div>
      <div class="stat" style="cursor:pointer" onclick="go('aclinics')"><div class="stat-ico" style="background:linear-gradient(135deg,rgba(236,72,153,.18),rgba(139,92,246,.12));color:#be185d">🏥</div><div><div class="stat-val">${totalClinics}</div><div class="stat-lbl">${t('clinics')}</div></div></div>
      <div class="stat"><div class="stat-ico">👥</div><div><div class="stat-val">${patients}</div><div class="stat-lbl">${t('total_patients')}</div></div></div>
      <div class="stat"><div class="stat-ico" style="background:var(--success-bg);color:var(--success)">📅</div><div><div class="stat-val">${totalAppts}</div><div class="stat-lbl">${t('total_appts')}</div></div></div>
    </div>
    <div class="grid grid-3" style="margin-bottom:14px">
      <div class="stat money"><div class="stat-ico">💰</div><div><div class="stat-val">${fmtDA(todayRev)}</div><div class="stat-lbl">${t('today_revenue')}</div></div></div>
      <div class="stat money"><div class="stat-ico">📊</div><div><div class="stat-val">${fmtDA(totalRev)}</div><div class="stat-lbl">${t('total_revenue')}</div></div></div>
      <div class="stat" style="cursor:pointer" onclick="go('adossiers')"><div class="stat-ico" style="background:var(--accent-light);color:var(--accent-primary)">📁</div><div><div class="stat-val">${totalDossiers}</div><div class="stat-lbl">${t('dossiers_medical')}</div></div></div>
    </div>
    ${totalUrg > 0 || pendingUrg > 0 ? `
      <div class="card" style="margin-bottom:14px;cursor:pointer;background:linear-gradient(135deg,rgba(239,68,68,.08),rgba(239,68,68,.02));border-color:rgba(239,68,68,.4)" onclick="go('aurgencies')">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
          <div style="display:flex;align-items:center;gap:14px">
            <div style="font-size:34px">🚨</div>
            <div>
              <div class="card-title" style="font-size:15px;color:var(--danger);margin-bottom:2px">${t('urgence_title')}</div>
              <div class="card-sub" style="margin-bottom:0">${totalUrg} urgence(s) — ${pendingUrg} en attente</div>
            </div>
          </div>
          <button class="pill-btn danger">${t('urgence_see_all')}</button>
        </div>
      </div>
    ` : ''}
    <div class="grid grid-4" style="margin-bottom:14px">
      <div class="stat"><div class="stat-ico" style="background:var(--warn-bg);color:var(--warn)">⏳</div><div><div class="stat-val">${pending}</div><div class="stat-lbl">${t('pending_c')}</div></div></div>
      <div class="stat"><div class="stat-ico" style="background:var(--success-bg);color:var(--success)">✓</div><div><div class="stat-val">${confirmed}</div><div class="stat-lbl">${t('confirmed_c')}</div></div></div>
      <div class="stat"><div class="stat-ico" style="background:var(--accent-light);color:var(--accent-primary)">✅</div><div><div class="stat-val">${done}</div><div class="stat-lbl">${t('status_done')}</div></div></div>
      <div class="stat"><div class="stat-ico" style="background:var(--danger-bg);color:var(--danger)">✕</div><div><div class="stat-val">${cancelled}</div><div class="stat-lbl">${t('cancelled_c')}</div></div></div>
    </div>
    <div class="card" style="margin-bottom:14px">
      <div class="card-title" style="font-size:15px">⚙️ ${t('commission_general')}</div>
      <div class="stats-tags">
        ${statTag(t('commission_general'), n2(commission) + ' DA', 'accent', true)}
        ${statTag(t('subscription_monthly_price_short'), n2(getSubscriptionMonthlyPrice()) + ' DA', 'accent', true)}
        ${statTag(t('subscription_yearly_price_short'), n2(getSubscriptionYearlyPrice()) + ' DA', 'accent', true)}
      </div>
    </div>
    <div class="grid grid-2">
      <div class="card">
        <div class="card-title">📅 ${t('today_appts')} <span class="tag accent">${todayAppts.length}</span></div>
        <div style="margin-top:12px">
          ${todayAppts.length ? todayAppts.sort((a,b)=>a.time.localeCompare(b.time)).slice(0,6).map(a=>{
            const doc = docById(a.doctorId);
            const c = a.clinicId ? clinicById(a.clinicId) : null;
            return `
            <div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--glass-border);font-size:12px">
              <strong style="min-width:42px;color:var(--accent-primary);font-family:var(--font-numbers)">${a.time}</strong>
              <span style="flex:1;font-weight:500">${esc(a.patientName)}</span>
              <span style="font-size:10.5px;color:var(--text-muted)">${c ? '🏥 '+esc(c.name) : (doc ? esc(doc.name) : '')}</span>
              ${statusTag(a.status)}
            </div>`;
          }).join('') : `<div class="empty" style="padding:20px"><div class="empty-ico">🌤️</div>${t('no_appts')}</div>`}
        </div>
      </div>
      <div class="card">
        <div class="card-title">🏆 Top médecins</div>
        <div style="margin-top:12px;display:flex;flex-direction:column;gap:10px">
          ${docStats.length ? docStats.map(({d,n})=>{
            const max = Math.max(1, docStats[0].n);
            const rating = getDoctorRating(d.id);
            return `
            <div style="display:flex;align-items:center;gap:10px;font-size:12px">
              <div style="width:30px;height:30px;border-radius:8px;background:var(--accent-light);display:grid;place-items:center;font-size:15px">${specialtyAvatar(d.specialty)}</div>
              <div style="flex:1;min-width:0">
                <div style="font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(d.name)}${rating.count>0?' · ⭐ '+rating.avg:''}</div>
                <div class="bar" style="margin-top:4px"><div class="bar-fill" style="width:${(n/max)*100}%"></div></div>
              </div>
              <span style="font-weight:500;min-width:24px;text-align:right;font-family:var(--font-numbers)">${n}</span>
            </div>`;
          }).join('') : `<div class="empty" style="padding:16px"><div class="empty-ico">🧑‍⚕️</div>${t('no_docs')}</div>`}
        </div>
      </div>
    </div>
  `;
}

/* ===== ADMIN — Médecins ===== */
function viewAdminDoctors(){
  const q = (state.adminDoctorsSearch||'').trim().toLowerCase();
  let allDocs = DB.doctors.slice();
  if(q){
    allDocs = allDocs.filter(d=>{
      const hay = `${d.name} ${d.specialty} ${d.wilaya} ${d.commune} ${d.email} ${d.phone}`.toLowerCase();
      return hay.includes(q);
    });
  }
  const totalPages = Math.max(1, Math.ceil(allDocs.length / DOCTORS_PER_PAGE));
  const page = Math.min(state.adminDoctorsPage || 1, totalPages);
  const slice = allDocs.slice((page-1)*DOCTORS_PER_PAGE, page*DOCTORS_PER_PAGE);
  const btns = [];
  const maxBtns = 7;
  let start = Math.max(1, page - 3);
  let end = Math.min(totalPages, start + maxBtns - 1);
  if(end - start < maxBtns - 1) start = Math.max(1, end - maxBtns + 1);
  if(start > 1) btns.push(`<button class="page-btn" onclick="state.adminDoctorsPage=1;render()">1</button>`, start>2?`<span class="page-info">…</span>`:'');
  for(let p=start; p<=end; p++) btns.push(`<button class="page-btn ${p===page?'active':''}" onclick="state.adminDoctorsPage=${p};render()">${p}</button>`);
  if(end < totalPages) btns.push(end<totalPages-1?`<span class="page-info">…</span>`:'', `<button class="page-btn" onclick="state.adminDoctorsPage=${totalPages};render()">${totalPages}</button>`);
  return `
    <div class="card" style="margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
      <div>
        <div class="card-title" style="margin-bottom:0">🧑‍⚕️ ${t('manage_doctors')} <span class="tag accent">${DB.doctors.length}</span></div>
        <div class="card-sub" style="margin:4px 0 0">${t('manage_doctors_sub')}</div>
      </div>
      <button class="pill-btn primary" onclick="openDoctorForm()">+ ${t('add_doctor')}</button>
    </div>
    <div class="card" style="margin-bottom:12px">
      <input class="input" id="adminDocsSearch" placeholder="${t('search_doctor_ph')}" value="${esc(state.adminDoctorsSearch)}" oninput="onAdminDoctorsSearch(this.value)">
    </div>
    ${slice.length ? slice.map(d=>{
      const apptCount = DB.appointments.filter(a=>String(a.doctorId)===String(d.id) && a.status!=='deleted').length;
      const servCount = servicesForDoctor(d.id).length;
      const days = (d.workDays||[]);
      const rating = getDoctorRating(d.id);
      const bill = getDoctorBilling(d);
      const clinics = clinicLinksForDoctor(d.id).filter(l=>l.status==='accepted').map(l=>clinicById(l.clinicId)).filter(Boolean);
      const owningClinic = d.ownedByClinic ? clinicById(d.ownedByClinic) : null;
      let billTag = '';
      if(bill.type === 'commission') billTag = `<span class="tag success">💰 ${n2(bill.commissionAmount)} DA</span>`;
      else if(bill.type === 'sub_monthly' || bill.type === 'sub_yearly'){
        const active = isSubscriptionActive(d);
        const daysLeft = getSubscriptionDaysLeft(d);
        billTag = `<span class="tag ${active?'accent':'danger'}">📅 ${esc(getSubscriptionTypeLabel(d))}${active?' · '+daysLeft+'j':' · Expiré'}</span>`;
      } else if(bill.type === 'sub_trial'){
        const active = isSubscriptionActive(d);
        const daysLeft = getSubscriptionDaysLeft(d);
        billTag = `<span class="tag ${active?'success':'danger'}">🎁 ${t('billing_type_sub_trial')}${active?' · '+daysLeft+'j':' · Expiré'}</span>`;
      } else billTag = `<span class="tag muted">💰 ${t('billing_type_none')}</span>`;
      return `
        <div class="admin-doc-row">
          <div class="doc-avatar">${specialtyAvatar(d.specialty)}</div>
          <div style="flex:1;min-width:200px">
            <div class="doc-name">${esc(d.name)} ${d.isClinicLocal?`<span class="tag clinic" style="font-size:9px;padding:1px 6px;margin-left:4px">🏥 ${t('doctor_local_badge')}</span>`:''}</div>
            <div class="doc-spec">${esc(d.specialty)} · ${esc(d.wilaya)}${d.commune?' · '+esc(d.commune):''}</div>
            <div class="doc-meta" style="margin-top:4px">
              <span>📞 ${esc(d.phone)}</span><span>✉️ ${esc(d.email)}</span>
              <span>${n2(d.fee)} DA</span><span>⏱️ ${d.duration} ${t('min')}</span>
            </div>
            ${owningClinic ? `<div style="font-size:11px;color:var(--accent-primary);margin-top:4px">🏥 Interne clinique : <strong>${esc(owningClinic.name)}</strong></div>` : ''}
            <div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap">
              <span class="tag">📅 ${apptCount} RDV</span>
              ${servCount?`<span class="tag accent">💉 ${servCount}</span>`:''}
              ${rating.count>0?`<span class="tag rating">⭐ ${rating.avg} (${rating.count})</span>`:`<span class="tag rating-empty">⭐ —</span>`}
              ${billTag}
              ${days.length?`<span class="tag success">🗓️ ${days.map(i=>DAY_NAMES_SHORT[i]).join(' ')}</span>`:`<span class="tag danger">🗓️ —</span>`}
              ${clinics.length?`<span class="tag clinic">🏥 ${clinics.length}</span>`:''}
              ${d.locked
                ? `<span class="tag danger">🔒 Session verrouillée</span>`
                : `<span class="tag success">🔓 Session ouverte</span>`}
            </div>
          </div>
          <div class="appt-actions">
            <button class="mini-btn ghost" onclick="openDoctorProfile('${jsStr(String(d.id))}')">👁️</button>
            ${d.locked
              ? `<button class="mini-btn green" onclick="toggleDoctorLock('${jsStr(String(d.id))}')" title="Ouvrir la session du médecin">🔓 Ouvrir session</button>`
              : `<button class="mini-btn red" onclick="toggleDoctorLock('${jsStr(String(d.id))}')" title="Verrouiller la session du médecin">🔒 Verrouiller</button>`}
            <button class="mini-btn ghost" onclick="openDoctorForm('${jsStr(String(d.id))}')">✏️</button>
            <button class="mini-btn ghost" onclick="openServicesManager('${jsStr(String(d.id))}')">💉</button>
            <button class="mini-btn red" onclick="confirmDeleteDoctor('${jsStr(String(d.id))}')">🗑️</button>
          </div>
        </div>`;
    }).join('') : `<div class="empty"><div class="empty-ico">🧑‍⚕️</div>${t('no_docs')}</div>`}
    ${allDocs.length > DOCTORS_PER_PAGE ? `
      <div class="pagination">
        <button class="page-btn" ${page===1?'disabled':''} onclick="state.adminDoctorsPage=${page-1};render()">‹</button>
        ${btns.join('')}
        <button class="page-btn" ${page===totalPages?'disabled':''} onclick="state.adminDoctorsPage=${page+1};render()">›</button>
        <span class="page-info">${page} / ${totalPages} · ${allDocs.length}</span>
      </div>
    ` : ''}
  `;
}
function onAdminDoctorsSearch(v){
  state.adminDoctorsSearch = v;
  state.adminDoctorsPage = 1;
  render();
}
