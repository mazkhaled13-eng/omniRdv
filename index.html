function refreshSubEndField(){
  const bTypeEl = document.getElementById('fBillingType');
  if(!bTypeEl) return;
  const bType = bTypeEl.value || 'none';
  const startEl = document.getElementById('fSubStart');
  const endEl = document.getElementById('fSubEnd');
  if(!endEl) return;
  if(bType !== 'sub_monthly' && bType !== 'sub_yearly'){ endEl.value = ''; return; }
  if(!startEl || !startEl.value){ endEl.value = ''; return; }
  const start = new Date(startEl.value + 'T00:00:00');
  const months = bType === 'sub_yearly' ? 12 : 1;
  const end = addMonths(start, months);
  endEl.value = end.toISOString().slice(0,10);
}
function onBillingTypeChange(){
  const bTypeEl = document.getElementById('fBillingType');
  if(!bTypeEl) return;
  const v = bTypeEl.value || 'none';
  window._billingType = v;
  const cb = document.getElementById('fCommissionBlock');
  const sb = document.getElementById('fSubscriptionBlock');
  const tb = document.getElementById('fTrialBlock');
  const yb = document.getElementById('fSubExtendYearBtn');
  if(cb) cb.style.display = v === 'commission' ? 'block' : 'none';
  if(sb) sb.style.display = (v === 'sub_monthly' || v === 'sub_yearly') ? 'block' : 'none';
  if(tb) tb.style.display = v === 'sub_trial' ? 'block' : 'none';
  if(yb) yb.style.display = v === 'sub_yearly' ? 'inline-flex' : 'none';
  if(v === 'sub_monthly' || v === 'sub_yearly'){
    const startEl = document.getElementById('fSubStart');
    if(startEl && !startEl.value){ startEl.value = todayISO(); }
    refreshSubEndField();
  }
  if(v === 'sub_trial'){
    const startEl = document.getElementById('fTrialStart');
    const endEl = document.getElementById('fTrialEnd');
    if(startEl && !startEl.value) startEl.value = todayISO();
    if(endEl && !endEl.value){
      const d = new Date(todayISO() + 'T00:00:00');
      d.setMonth(d.getMonth() + 1);
      endEl.value = d.toISOString().slice(0,10);
    }
  }
}
function extendSubscription(kind){
  const startEl = document.getElementById('fSubStart');
  if(!startEl || !startEl.value){ toast('Choisissez une date de début','error'); return; }
  const base = new Date(startEl.value + 'T00:00:00');
  const monthsToAdd = kind === 'month' ? 1 : 12;
  const newStart = addMonths(base, monthsToAdd);
  startEl.value = newStart.toISOString().slice(0,10);
  refreshSubEndField();
  toast('Abonnement prolongé','success');
}
function onWilayaChange(){
  const w = ($('#fWilaya')?.value||'').trim();
  const list = DB.communes[w] || [];
  const sel = $('#fCommune'); if(!sel) return;
  sel.disabled = !w; sel.style.opacity = w ? '1' : '.5';
  sel.innerHTML = `<option value="">${t('select_commune_ph')}</option>` + list.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');
}
function toggleWorkDay(day, btn){
  const idx = window._workDays.indexOf(day);
  if(idx >= 0){ window._workDays.splice(idx, 1); btn.classList.remove('on'); }
  else { window._workDays.push(day); btn.classList.add('on'); }
}
function updateSlotPreview(){
  const dur = parseInt($('#fDur')?.value,10)||30;
  const start = $('#fStart')?.value || '08:00';
  const end = $('#fEnd')?.value || '17:00';
  const slots = generateSlots(start, end, dur);
  const disabled = window._disabledSlots || [];
  const cont = document.querySelector('#slotPreview'); if(!cont) return;
  cont.innerHTML = slots.length
    ? slots.map(s=>{
        const off = disabled.includes(s);
        return `<button type="button" class="pv-slot ${off?'off':''}" onclick="togglePreviewSlot('${s}')">${s}</button>`;
      }).join('')
    : `<span style="color:var(--text-muted);font-size:12px">${t('no_slots')}</span>`;
}
function togglePreviewSlot(time){
  window._disabledSlots = window._disabledSlots || [];
  const idx = window._disabledSlots.indexOf(time);
  if(idx >= 0) window._disabledSlots.splice(idx,1); else window._disabledSlots.push(time);
  updateSlotPreview();
}
async function saveDoctor(id, isSelf){
  isSelf = !!isSelf;
  const name = ($('#fName')?.value||'').trim();
  const specialty = ($('#fSpec')?.value||'').trim();
  const wilaya = ($('#fWilaya')?.value||'').trim();
  const commune = ($('#fCommune')?.value||'').trim();
  const address = ($('#fAddr')?.value||'').trim();
  const phone = ($('#fPhone')?.value||'').trim();
  const email = ($('#fEmail')?.value||'').trim();
  const feeInput = $('#fFee');
  const fee = feeInput ? (parseInt(feeInput.value,10)||0) : (docById(id)?.fee || 0);
  const duration = parseInt($('#fDur')?.value,10)||30;
  // --- Gestion des mots de passe ---
  let pwd;
  let recettePwd;

  const pwdRaw = ($('#fPwd')?.value||'').trim();
  const recettePwdRaw = ($('#fRecettePwd')?.value||'').trim();

  if(isSelf){
    // Session médecin : NE TOUCHE JAMAIS au mot de passe finance
    // et ne change le mot de passe session QUE si un nouveau est saisi
    const existingDoc = id ? DB.doctors.find(x=>String(x.id)===String(id)) : null;
    pwd = pwdRaw
      ? (/^[0-9a-f]{64}$/i.test(pwdRaw) ? pwdRaw : await hashPassword(pwdRaw))
      : (existingDoc ? existingDoc.password : DEFAULT_PWD);
    // On conserve TOUJOURS le mot de passe finance existant
    recettePwd = existingDoc ? existingDoc.recettePassword : DEFAULT_PWD;
  } else {
    // Admin : il peut tout modifier
    const existingDoc = id ? DB.doctors.find(x=>String(x.id)===String(id)) : null;
    pwd = pwdRaw
      ? (/^[0-9a-f]{64}$/i.test(pwdRaw) ? pwdRaw : await hashPassword(pwdRaw))
      : (existingDoc ? existingDoc.password : DEFAULT_PWD);
    recettePwd = recettePwdRaw
      ? (/^[0-9a-f]{64}$/i.test(recettePwdRaw) ? recettePwdRaw : await hashPassword(recettePwdRaw))
      : (existingDoc ? existingDoc.recettePassword : DEFAULT_PWD);
  }
  const bio = ($('#fBio')?.value||'').trim();
  const workStart = $('#fStart')?.value || '08:00';
  const workEnd = $('#fEnd')?.value || '17:00';
  const workDays = [...(window._workDays || [])].sort((a,b)=>a-b);
  const disabledSlots = [...(window._disabledSlots || [])];

  if(!name || !specialty || !wilaya){ toast(t('required_fields'),'error'); return; }
  if(!isSelf && !email){ toast('Email obligatoire (sert d\'identifiant)','error'); return; }
  if(toMin(workStart) >= toMin(workEnd)){ toast('Heure de fin doit être après le début','error'); return; }
  if(!workDays.length){ toast('Sélectionnez au moins un jour de travail','error'); return; }
  if(!DB.specialties.includes(specialty)) DB.specialties.push(specialty);
  if(!DB.wilayas.includes(wilaya)) DB.wilayas.push(wilaya);
  if(!DB.communes[wilaya]) DB.communes[wilaya] = [];
  if(commune && !DB.communes[wilaya].includes(commune)) DB.communes[wilaya].push(commune);

  const commonFields = {name, specialty, wilaya, commune, address, phone, email, bio, workDays, workStart, workEnd, disabledSlots, password: pwd};

  if(isSelf){
    if(id){
      const d = DB.doctors.find(x=>String(x.id)===String(id)); if(!d) return;
      Object.assign(d, commonFields);
      if(state.doctor && String(state.doctor.id)===String(id)){
        state.doctor = d;
      }
    }
    saveDB(); closeModal(); render();
    toast(t('profile_saved'),'success');
    return;
  }

  const bTypeEl = document.getElementById('fBillingType');
  const billingType = bTypeEl ? (bTypeEl.value || 'none') : 'none';
  const commissionAmountInput = $('#fCommissionAmount');
  const commissionAmount = commissionAmountInput ? parseInt(commissionAmountInput.value,10) : null;
  const subStartInput = $('#fSubStart');
  const subStart = subStartInput && subStartInput.value ? new Date(subStartInput.value + 'T00:00:00').toISOString() : null;
  const trialStartInput = $('#fTrialStart');
  const trialEndInput = $('#fTrialEnd');
  const trialStart = trialStartInput && trialStartInput.value ? new Date(trialStartInput.value + 'T00:00:00').toISOString() : null;
  const trialEnd = trialEndInput && trialEndInput.value ? new Date(trialEndInput.value + 'T00:00:00').toISOString() : null;

  if(billingType === 'commission'){
    if(commissionAmount == null || isNaN(commissionAmount) || commissionAmount < 0){
      toast('Montant de commission invalide','error'); return;
    }
  }
  if(billingType === 'sub_monthly' || billingType === 'sub_yearly'){
    if(!subStart){ toast('Date de début abonnement manquante','error'); return; }
  }
  if(billingType === 'sub_trial'){
    if(!trialStart || !trialEnd){ toast('Dates d\'essai manquantes','error'); return; }
    if(new Date(trialEnd).getTime() <= new Date(trialStart).getTime()){ toast('La date de fin doit être après la date de début','error'); return; }
  }

  let billingFields;
  if(billingType === 'commission'){
    billingFields = {billingType:'commission', commissionAmount, subStart:null, subTrialEnd:null};
  } else if(billingType === 'sub_monthly' || billingType === 'sub_yearly'){
    billingFields = {billingType, commissionAmount:null, subStart, subTrialEnd:null};
  } else if(billingType === 'sub_trial'){
    billingFields = {billingType:'sub_trial', commissionAmount:null, subStart:trialStart, subTrialEnd:trialEnd};
  } else {
    billingFields = {billingType:'none', commissionAmount:null, subStart:null, subTrialEnd:null};
  }

  if(id){
    const d = DB.doctors.find(x=>String(x.id)===String(id)); if(!d) return;
    const oldId = d.id;
    const newId = email;
    if(oldId !== newId && DB.doctors.some(x=>String(x.id)===newId && String(x.id)!==String(oldId))){
      toast('Un médecin avec cet email existe déjà','error'); return;
    }
    Object.assign(d, commonFields, {fee, duration, recettePassword: recettePwd, id: newId}, billingFields);
    delete d.subEnd;
    if(oldId !== newId){
      DB.services.forEach(s=>{ if(String(s.doctorId)===String(oldId)) s.doctorId = newId; });
      DB.appointments.forEach(a=>{ if(String(a.doctorId)===String(oldId)) a.doctorId = newId; });
      DB.notifications.forEach(n=>{ if(n.toDoctorId!=null && String(n.toDoctorId)===String(oldId)) n.toDoctorId = newId; });
      DB.messages.forEach(m=>{
        if(m.from && String(m.from.id)===String(oldId)) m.from = {...m.from, id:newId, key:`doctor_${newId}`};
        if(m.to && String(m.to.id)===String(oldId)) m.to = {...m.to, id:newId, key:`doctor_${newId}`};
      });
      _pendingDeletes.doctors.push(oldId);
      savePendingDeletes();
    }
    if(state.doctor && String(state.doctor.id)===String(id)){
      state.doctor = d;
      if(isSubscriptionType(d) && !isSubscriptionActive(d)){
        hideSubscriptionExpiredModal();
        saveDB();
        closeModal();
        render();
        showSubscriptionExpiredModal();
        return;
      }
    }
  } else {
    if(DB.doctors.some(x=>String(x.id)===email)){ toast('Un médecin avec cet email existe déjà','error'); return; }
    DB.doctors.push({
      id: email, name, specialty, wilaya, commune, address, phone, email, fee, duration,
      password: DEFAULT_PWD, recettePassword: DEFAULT_PWD, bio, workDays, workStart, workEnd,
      disabledSlots, createdAt: todayISO(), sessionClosed:false, locked:false, ...billingFields
    });
  }
  saveDB(); closeModal(); render();
  toast(t('doctor_saved'),'success');
}

function deleteDoctor(id){
  const d = docById(id); if(!d) return;
  _pendingDeletes.doctors.push(id);
  savePendingDeletes();
  DB.doctors = DB.doctors.filter(x=>String(x.id)!==String(id));
  DB.appointments = DB.appointments.filter(a=>String(a.doctorId)!==String(id));
  DB.notifications = DB.notifications.filter(n=>String(n.toDoctorId)!==String(id));
  DB.services = DB.services.filter(s=>String(s.doctorId)!==String(id));
  if(state.doctor && String(state.doctor.id)===String(id)) state.doctor = null;
  saveDB(); closeModal(); render(); toast(t('doctor_deleted'),'success');
}

      <button class="pill-btn success" onclick="closeModal();confirmApptWithNotify('${a.id}')">✓ ${t('confirm_rdv')}</button>`;
  } else if(a.status==='confirmed'){
    actionsHTML = `
      <button class="pill-btn" onclick="closeModal()">${t('close')}</button>
      <button class="pill-btn danger" onclick="confirmDoctorAction('${a.id}','cancel')">✕ ${t('cancel')}</button>

        : `<button class="pill-btn" disabled title="${esc(validationBlockedMsg(a))}">⏳ ${t('validate')}</button>`}`;
  } else {
    actionsHTML = `<button class="pill-btn" onclick="closeModal()">${t('close')}</button>`;
  }
  openModal(n.title, n.message, body, actionsHTML);
}

  const refNo = 'STATS-' + String(Date.now()).slice(-6) + '/' + new Date().getFullYear();
  const periodLabel = getStatsPeriodLabel();
  function barChart(entries, gradient){
    if(!entries.length) return `<p class="nodata">${t('stats_no_data')}</p>`;
    const max = Math.max(1, ...entries.map(e=>e[1]));
    return entries.map(([lbl,val])=>`
      <div class="chart-row">
        <div class="chart-lbl" title="${esc(lbl)}">${esc(lbl)}</div>
        <div class="chart-bar-wrap"><div class="chart-bar" style="width:${Math.max((val/max)*100, 2)}%;background:${gradient}"></div></div>
        <div class="chart-val">${val}</div>
      </div>
    `).join('');
  }
  function tableRows(entries){
    if(!entries.length) return `<tr><td colspan="4" class="nodata-td">${t('stats_no_data')}</td></tr>`;
    const total = entries.reduce((s,e)=>s+e[1],0);
    return entries.map(([lbl,val],i)=>{
      const pct = total>0 ? ((val/total)*100).toFixed(1) : '0.0';
      const rankCls = i===0 ? 'gold' : i===1 ? 'silver' : i===2 ? 'bronze' : '';
      return `<tr>
        <td class="rank"><span class="rank-badge ${rankCls}">${i+1}</span></td>
        <td class="label">${esc(lbl)}</td>
        <td class="num">${val}</td>

    [t('status_pending'), s.statusCounts.pending, '#f59e0b'],

    [t('status_done'), s.statusCounts.done, '#8b5cf6'],
    [t('status_cancelled'), s.statusCounts.cancelled, '#ef4444']
  ];
  const weekdayEntries = DAY_NAMES_LONG.map((lbl,i)=>[lbl, s.weekdayCounts[i]]);
  const hourEntries = s.sortedHours.map(([h,n])=>[h+':00', n]);
  const monthlyEntries = Object.entries(s.monthly).map(([k,v])=>{
    const [y,m] = k.split('-');
    return [`${MONTH_NAMES[parseInt(m,10)-1].slice(0,3)} ${y}`, v];
  });
  const maxAge = Math.max(1, ...ageEntries.map(e=>e[1]));

function computeQuickRevenue(){
  const q = state.quickRev;
  let list = DB.appointments.filter(a=>a.status==='done');
  if(q.doctorId !== 'all') list = list.filter(a=>String(a.doctorId)===String(q.doctorId));
  let periodLabel = '';
  if(q.periodType === 'day'){
    if(!q.dayDate) return null;
    list = list.filter(a=>a.date === q.dayDate);
    periodLabel = fmtLongDate(q.dayDate);
  } else if(q.periodType === 'month'){
    const y = q.year || currentYear();
    const m = q.month || currentMonth();
    const key = `${y}-${String(m).padStart(2,'0')}`;
    list = list.filter(a=> a.date.startsWith(key));
    periodLabel = `${MONTH_NAMES[m-1]} ${y}`;
  } else {
    if(!q.startDate || !q.endDate) return null;
    list = list.filter(a=> a.date >= q.startDate && a.date <= q.endDate);
    periodLabel = `${fmtDate(q.startDate)} → ${fmtDate(q.endDate)}`;
  }
  list.sort((a,b)=>String(a.date+a.time).localeCompare(String(b.date+b.time)));
  const total = list.reduce((sum,a)=>sum+apptCommission(a),0);
  const docLabel = q.doctorId==='all' ? t('billing_all_doctors') : (docById(q.doctorId)?.name || '—');
  return {list, total, periodLabel, docLabel};
}

function computeBillingData(){
  const b = state.billing;
  let list = DB.appointments.filter(a=>a.status==='done');
  if(b.doctorId !== 'all') list = list.filter(a=>String(a.doctorId)===String(b.doctorId));
  let periodLabel = '';
  if(b.periodType === 'day'){
    if(!b.dayDate) return null;
    list = list.filter(a=>a.date === b.dayDate);
    periodLabel = fmtLongDate(b.dayDate);
  } else if(b.periodType === 'month'){
    const y = b.year || currentYear();
    const m = b.month || currentMonth();
    const key = `${y}-${String(m).padStart(2,'0')}`;
    list = list.filter(a=> a.date.startsWith(key));
    periodLabel = `${MONTH_NAMES[m-1]} ${y}`;
  } else {
    if(!b.startDate || !b.endDate) return null;
    list = list.filter(a=> a.date >= b.startDate && a.date <= b.endDate);
    periodLabel = `${fmtDate(b.startDate)} → ${fmtDate(b.endDate)}`;
  }
  list.sort((a,b)=>String(a.date+a.time).localeCompare(String(b.date+b.time)));
  const total = list.reduce((s,a)=>s+apptCommission(a),0);
  const docLabel = b.doctorId==='all' ? t('billing_all_doctors') : (docById(b.doctorId)?.name || '—');
  const totalWords = numberToFrenchWords(total) + ' ' + t('dinars');
  return {list, total, periodLabel, docLabel, totalWords};
}

  };

  return Object.keys(reg).length + 1;

async function sendInvoicesToDoctors(){
  const me = currentUserInfo();
  if(!me){ toast(t('required_fields'),'error'); return; }
  const b = state.billing;
  if(b.periodType === 'day' && !b.dayDate){ toast(t('billing_choose_day'),'error'); return; }
  if(b.periodType === 'interval' && (!b.startDate || !b.endDate)){ toast(t('billing_choose_dates'),'error'); return; }
  const data = computeBillingData();
  if(!data){ toast(t('billing_no_data'),'error'); return; }
  const {list, periodLabel} = data;
  if(!list.length){ toast(t('billing_no_data'),'error'); return; }

  let groups = [];
  if(b.doctorId === 'all'){
    const grouped = {};
    list.forEach(a => {
      if(!grouped[a.doctorId]) grouped[a.doctorId] = [];
      grouped[a.doctorId].push(a);
    });
    const docIds = Object.keys(grouped).sort((a,c)=>{
      const da = docById(a); const dc = docById(c);
      return String(da?.name||'').localeCompare(String(dc?.name||''));
    });
    groups = docIds.map(id => ({docId:id, appts: grouped[id]}));
  } else {
    const doc = docById(b.doctorId);
    if(!doc){ toast(t('doctor_not_found'),'error'); return; }
    groups = [{docId: b.doctorId, appts: list.filter(a=>String(a.doctorId)===String(b.doctorId))}];
  }

  let subject;
  if(b.periodType === 'month'){
    subject = `Facture mois de ${periodLabel}`;
  } else if(b.periodType === 'day'){
    subject = `Facture du ${periodLabel}`;
  } else {
    subject = `Facture ${periodLabel}`;
  }

  let sent = 0;
  for(const {docId, appts} of groups){
    const doc = docById(docId);
    if(!doc) continue;
    const isTrialDoc = doc.billingType === 'sub_trial';
    const isSubDoc = (doc.billingType === 'sub_monthly' || doc.billingType === 'sub_yearly') && isSubscriptionActive(doc);

    let invoiceHTML, bodyText;
    if(isTrialDoc){
      invoiceHTML = buildMessageInvoiceHTML(doc, appts, periodLabel, 0, false, true, null);
      bodyText = t('billing_invoice_body').replace('{name}', doc.name).replace('{period}', periodLabel).replace('{total}', t('billing_no_billable_trial'));
    } else if(isSubDoc){
      const subData = buildSubscriptionInvoiceData(doc);
      const subTotal = subData ? subData.finalPrice : 0;
      const subInvNum = assignSubscriptionInvoiceNumberForDoctor(docId);
      const subInvNo = formatSubInvoiceNumberFromCount(subInvNum);
      invoiceHTML = buildMessageInvoiceHTML(doc, appts, periodLabel, subTotal, true, false, subInvNo);
      bodyText = t('billing_invoice_body').replace('{name}', doc.name).replace('{period}', periodLabel).replace('{total}', fmtDA(subTotal));
    } else {
      const docTotal = appts.reduce((s,a)=>s+apptCommission(a),0);
      const invNum = assignInvoiceNumberForDoctor(docId);
      const invNo = invNum !== null ? formatInvoiceNumberFromCount(invNum) : null;
      invoiceHTML = buildMessageInvoiceHTML(doc, appts, periodLabel, docTotal, false, false, invNo);
      bodyText = t('billing_invoice_body').replace('{name}', doc.name).replace('{period}', periodLabel).replace('{total}', fmtDA(docTotal));
    }

    const msg = {
      id: 'MSG-'+uid('M'),
      from: {key: me.key, role: me.role, id: me.id, name: me.name, avatar: me.avatar},
      to: {key:`doctor_${doc.id}`, role:'doctor', id:doc.id, name:doc.name, avatar:specialtyAvatar(doc.specialty)},
      subject,
      body: bodyText,
      bodyHTML: invoiceHTML,
      files: [],
      date: nowISO(),
      read: false,
      deletedBy: []
    };
    DB.messages.unshift(msg);
    sent++;
  }
  saveDB();
  if(sent === 0){ toast(t('msg_no_recipient'),'error'); return; }
  toast(t('billing_sent_to_doctor') + ' (' + sent + ')','success');
  closeModal();
}
function printBillingReport(){
  const b = state.billing;
  if(b.periodType === 'day' && !b.dayDate){ toast(t('billing_choose_day'),'error'); return; }
  if(b.periodType === 'interval' && (!b.startDate || !b.endDate)){ toast(t('billing_choose_dates'),'error'); return; }
  const data = computeBillingData();
  if(!data){ toast(t('billing_no_data'),'error'); return; }
  const {list, total, periodLabel, totalWords} = data;
  if(!list.length){ toast(t('billing_no_data'),'error'); return; }

  if(b.doctorId === 'all'){
    const grouped = {};
    list.forEach(a => {
      if(!grouped[a.doctorId]) grouped[a.doctorId] = [];
      grouped[a.doctorId].push(a);
    });
    const docIds = Object.keys(grouped).sort((a,b)=>{
      const da = docById(a); const db = docById(b);
      return String(da?.name||'').localeCompare(String(db?.name||''));
    });
    if(!DB.invoiceRegistry) DB.invoiceRegistry = {};
    if(!DB.subInvoiceRegistry) DB.subInvoiceRegistry = {};
    let pages = '';
    let lastIdx = docIds.length - 1;
    docIds.forEach((docId, idx) => {
      const doc = docById(docId);
      if(!doc) return;
      const docAppts = grouped[docId];
      const isSub = isSubscriptionType(doc);
      const invNum = assignInvoiceNumberForDoctor(docId);
      const invNo = isSub ? formatSubInvoiceNumberFromCount(invNum) : formatInvoiceNumberFromCount(invNum);
      const docTotal = docAppts.reduce((s,a)=>s+apptCommission(a),0);
      const docTotalWords = numberToFrenchWords(docTotal) + ' ' + t('dinars');
      pages += buildInvoicePageHTML(doc, docAppts, periodLabel, invNo, docTotalWords, docTotal);
      if(idx < lastIdx){
        pages += `<div class="page-break"></div>`;
      }
    });
    saveDB();
    const html = `<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>OmniMed — Factures ${periodLabel}</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Rubik:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>${buildInvoiceStyles()}</style></head>
<body>${pages}</body></html>`;
    printHTML(html);
    toast(t('printing_invoices').replace('{n}', docIds.length), 'success');
    return;
  }

  const singleDoc = docById(b.doctorId);
  const isSubDocForPrint = singleDoc && isSubscriptionType(singleDoc) && singleDoc.billingType !== 'sub_trial';
  const isTrialDocForPrint = singleDoc && singleDoc.billingType === 'sub_trial';
  let invNo = null;
  if(!isTrialDocForPrint && singleDoc){
    const invNum = assignInvoiceNumberForDoctor(singleDoc.id);
    invNo = isSubDocForPrint ? formatSubInvoiceNumberFromCount(invNum) : formatInvoiceNumberFromCount(invNum);
  }
  const title = isTrialDocForPrint ? t('billing_type_sub_trial') : (isSubDocForPrint ? `${t('sub_invoice_header_title')} N° ${invNo}` : ('Facture N° ' + invNo));
  const html = `<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>OmniMed — ${title}</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Rubik:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>${buildInvoiceStyles()}</style></head>
<body>${buildInvoicePageHTML(singleDoc, list, periodLabel, invNo, totalWords, total)}</body></html>`;
  printHTML(html);
}

function adminApptRow(a){

    <div class="appt ${isDeleted?'deleted':''} ${a.internal?'internal':''} ${isSelected?'selected-row':''}">
      <div class="appt-checkbox-wrap">
        <input type="checkbox" class="msg-checkbox" ${isSelected?'checked':''} onchange="toggleApptSelect('${a.id}')">
      </div>
      <div class="appt-time"><div class="h">${a.time}</div>
        <div class="d">${new Date(a.date+'T00:00:00').toLocaleDateString('fr-FR',{day:'2-digit',month:'short'})}</div>

      <div class="appt-body">
        <div class="appt-patient">${esc(a.patientName)}${a.patientAge?` <span style="font-weight:400;color:var(--text-muted);font-size:11px">(${a.patientAge})</span>`:''} <span style="font-weight:400;color:var(--text-muted);font-size:11px">→ ${esc(doc?.name||'—')}</span></div>

          <span>${statusTag(a.status)}</span>
          ${a.internal?`<span class="tag internal">🗂️ ${t('internal_badge')}</span>`:''}
          <span>📞 ${esc(a.patientPhone)}</span>
          ${a.motif?`<span>📝 ${esc(a.motif)}</span>`:''}
          ${a.patientWilaya?`<span>🗺️ ${esc(a.patientWilaya)}</span>`:''}
          ${a.services&&a.services.length?`<span>💉 ${a.services.length}</span>`:''}
          ${docN?`<span class="doc-chip" onclick="event.stopPropagation();openApptDocuments('${a.id}')">📎 ${docN}</span>`:''}
          ${a.rating && a.rating>0 ? `<span class="tag rating">⭐ ${a.rating}/5</span>` : ''}
          <span>🆔 ${a.id}</span>
        </div>
        ${cancelled?`
          <div style="margin-top:5px;padding:5px 8px;background:var(--danger-bg);border-radius:6px;font-size:11px;color:var(--danger);border-left:3px solid var(--danger)">
            <strong>❌ Motif d'annulation :</strong> ${esc(a.cancelReason)}
          </div>`:''}
      </div>
      <div class="appt-actions">
        ${!isDeleted ? `
          ${docN?`<button class="mini-btn purple" onclick="openApptDocuments('${a.id}')">📎</button>`:''}
          ${a.status==='pending'?`<button class="mini-btn green" onclick="confirmApptWithNotify('${a.id}')">✓ ${t('confirm_rdv')}</button>`:''}
          ${a.status==='confirmed'?(
            eligibleValidate
              ? `<button class="mini-btn purple" onclick="confirmDoctorAction('${a.id}','done')">✓ ${t('validate')}</button>`
              : `<button class="mini-btn ghost" disabled title="${esc(validationBlockedMsg(a))}">⏳ ${t('validate')}</button>`
          ):''}
          ${(a.status==='pending'||a.status==='confirmed')?`<button class="mini-btn out-red" onclick="confirmDoctorAction('${a.id}','cancel')">✕ ${t('cancel')}</button>`:''}

function exportFullJSON(){
  try{
    const payload = {
      app:'OmniMed',
      schemaVersion: 3,
      exportedAt: new Date().toISOString(),
      data: DB
    };
    const json = JSON.stringify(payload, null, 2);
    state.lastExportSize = json.length;
    const blob = new Blob([json], {type:'application/json;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    const ts = new Date().toISOString().slice(0,19).replace(/[:T]/g,'-');
    a.download = `omnimed_backup_${ts}.json`;
    a.click();
    setTimeout(()=>URL.revokeObjectURL(url), 1500);
    render();
    toast(t('json_exported'), 'success');
  }catch(e){
    toast(t('json_import_error'),'error');
  }
}
function importFullJSON(input){
  const file = input.files && input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try{
      const parsed = JSON.parse(e.target.result);
      const data = parsed && parsed.data ? parsed.data : parsed;
      if(!data || typeof data !== 'object'){ toast(t('json_import_error'),'error'); input.value=''; return; }
      if(data.schemaVersion !== undefined && data.schemaVersion !== 1 && data.schemaVersion !== 2 && data.schemaVersion !== 3){
        toast(t('json_invalid_version'),'error'); input.value=''; return;
      }
      openModal(t('json_import'), t('json_import_confirm'), '',
        `<button class="pill-btn" onclick="closeModal()">${t('cancel')}</button>
         <button class="pill-btn danger" onclick="doImportJSON(${JSON.stringify(JSON.stringify(data)).replace(/"/g,'&quot;')})">📥 ${t('json_import')}</button>`);
    }catch(err){
      toast(t('json_import_error'),'error');
    }
    input.value = '';
  };
  reader.readAsText(file);
}
function doImportJSON(dataStr){
  try{
    const data = JSON.parse(dataStr);
    DB = data;
    if(!DB.settings) DB.settings = {commission: COMMISSION_GENERAL_DEFAULT, subMonthly: SUB_MONTHLY_DEFAULT, subYearly: SUB_YEARLY_DEFAULT, subDiscount: SUB_DISCOUNT_DEFAULT};
    if(DB.settings.commission === undefined) DB.settings.commission = COMMISSION_GENERAL_DEFAULT;
    if(DB.settings.subMonthly === undefined) DB.settings.subMonthly = SUB_MONTHLY_DEFAULT;
    if(DB.settings.subYearly === undefined) DB.settings.subYearly = SUB_YEARLY_DEFAULT;
    if(DB.settings.subDiscount === undefined) DB.settings.subDiscount = SUB_DISCOUNT_DEFAULT;
    if(!DB.doctors) DB.doctors = [];
    if(!DB.appointments) DB.appointments = [];
    if(!DB.services) DB.services = [];
    if(!DB.messages) DB.messages = [];
    if(!DB.notifications) DB.notifications = [];
    if(!DB.invoiceRegistry) DB.invoiceRegistry = {};
    if(!DB.subInvoiceRegistry) DB.subInvoiceRegistry = {};
    if(!DB.specialties || !DB.specialties.length) DB.specialties = [...DEFAULT_SPECIALTIES];
    if(!DB.wilayas) DB.wilayas = [...WILAYAS];
    if(!DB.communes) DB.communes = JSON.parse(JSON.stringify(COMMUNES));
    if(!DB.admin) DB.admin = {username:'admin', password:DEFAULT_PWD};
    DB.schemaVersion = 3;
    saveDB();
    closeModal();
    state.doctor = null; state.admin = null; state.role = 'patient'; state.view = 'home';
    hideSubscriptionExpiredModal();
    render();
    toast(t('json_imported'), 'success');
  }catch(e){
    toast(t('json_import_error'),'error');
  }
}
function qrSVG(seed){
  try{
    if(typeof qrcode !== 'function') throw new Error('lib manquante');
    const qr = qrcode(0, 'M');
    qr.addData(String(seed));
    qr.make();
    return qr.createSvgTag({ cellSize: 3, margin: 0, scalable: true });
  }catch(e){
    console.warn('QR fallback:', e);
    let h = 0; for(const c of String(seed)) h = (h*31 + c.charCodeAt(0)) >>> 0;
    const n = 21, cells = [];
    const rand = () => { h = (h*1664525 + 1013904223) >>> 0; return h / 4294967296; };
    for(let y=0;y<n;y++) for(let x=0;x<n;x++){
      const finder = (x<7&&y<7)||(x>=n-7&&y<7)||(x<7&&y>=n-7);
      let on;
      if(finder){
        const lx = x>=n-7 ? x-(n-7) : x;
        const ly = y>=n-7 ? y-(n-7) : y;
        on = (lx===0||lx===6||ly===0||ly===6) || (lx>=2&&lx<=4&&ly>=2&&ly<=4);
      } else on = rand() > 0.55;
      if(on) cells.push(`<rect x="${x}" y="${y}" width="1" height="1" fill="#1f2937"/>`);
    }
    return `<svg viewBox="0 0 ${n} ${n}" xmlns="http://www.w3.org/2000/svg">${cells.join('')}</svg>`;
  }
}

  await loadDB();
  state.filter.date = todayISO();
  if(!state.billing.month) state.billing.month = currentMonth();
  if(!state.billing.year) state.billing.year = currentYear();
  if(!state.quickRev.month) state.quickRev.month = currentMonth();
  if(!state.quickRev.year) state.quickRev.year = currentYear();
  if(!state.docRev.month) state.docRev.month = currentMonth();
  if(!state.docRev.year) state.docRev.year = currentYear();
  if(!state.statsPeriod) state.statsPeriod = {type:'all', month: currentMonth(), year: currentYear()};
  if(!state.statsPeriod.month) state.statsPeriod.month = currentMonth();
  if(!state.statsPeriod.year) state.statsPeriod.year = currentYear();
  state.quickRevVisible = QUICK_REV_PER_PAGE;
  loadPrefs(); checkReminders();
  setInterval(checkReminders, 5 * 60 * 1000);
  // Filet de sécurité : resync complète toutes les 60s
  // (utile si Realtime a raté un event pendant une micro-coupure réseau)
  setInterval(async () => {
    if(_isApplyingRemote) return;
    if(document.visibilityState !== 'visible') return;
    _isApplyingRemote = true;
    try {
      await loadDB();
      if(state.doctor){
        const refreshed = DB.doctors.find(d=>d.id===state.doctor.id);
        if(refreshed) state.doctor = refreshed;
      }
      render();
    } finally {
      _isApplyingRemote = false;
    }
  }, 60000);
  applyDir(); render();
  subscribeRealtime();
  setupVisibilityResync();
}
