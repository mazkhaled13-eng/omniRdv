function deleteDoctor(id){
  DB.doctors = DB.doctors.filter(d=>d.id!==id);
  DB.appointments = DB.appointments.filter(a=>a.doctorId!==id);
  DB.notifications = DB.notifications.filter(n=>n.toDoctorId!==id);
  DB.services = DB.services.filter(s=>s.doctorId!==id);
  if(state.doctor && state.doctor.id===id) state.doctor = null;
  saveDB(); closeModal(); render(); toast(t('doctor_deleted'),'success');
}
function openNotifDetail(notifId){
  const n = DB.notifications.find(x=>x.id===notifId); if(!n) return;
  n.read = true; saveDB();
  if(!n.apptId){ render(); return; }
  const a = DB.appointments.find(x=>x.id===n.apptId);
  if(!a){ DB.notifications = DB.notifications.filter(x=>x.id!==notifId); saveDB(); render(); return; }
  const doc = docById(a.doctorId);
  const body = `
    <div style="font-size:13px;line-height:2">
      <div><strong>${t('patient')} :</strong> ${esc(a.patientName)}${a.patientAge?` (${a.patientAge} ${t('billing_years_old')})`:''}</div>
      <div><strong>${t('phone')} :</strong> ${esc(a.patientPhone)}</div>
      ${a.patientEmail?`<div><strong>${t('email')} :</strong> ${esc(a.patientEmail)}</div>`:''}
      <div><strong>${t('doctor')} :</strong> ${esc(doc?.name||'—')}</div>
      <div><strong>${t('when')} :</strong> ${fmtLongDate(a.date)} — ${a.time}</div>
      <div><strong>${t('motif')} :</strong> ${esc(a.motif)}</div>
      ${a.patientWilaya?`<div><strong>${t('patient_wilaya')} :</strong> ${esc(a.patientWilaya)}</div>`:''}
      ${a.services&&a.services.length?`<div><strong>${t('services')} :</strong> ${a.services.map(sv=>esc(sv.name)+' ('+n2(sv.price)+' DA)').join(', ')}</div>`:''}
      <div style="margin-top:6px"><strong>Statut :</strong> ${statusTag(a.status)}</div>
      ${a.cancelReason?`<div style="margin-top:6px;padding:6px 10px;background:var(--danger-bg);border-radius:6px;color:var(--danger);border-left:3px solid var(--danger)"><strong>❌ ${t('cancel_reason')} :</strong> ${esc(a.cancelReason)}</div>`:''}
    </div>
  `;
  let actionsHTML = '';
  if(a.status==='pending'){
    actionsHTML = `
      <button class="pill-btn" onclick="closeModal()">${t('close')}</button>
      <button class="pill-btn danger" onclick="confirmDoctorAction('${a.id}','cancel')">✕ ${t('cancel')}</button>
      <button class="pill-btn success" onclick="closeModal();confirmApptWithNotify('${a.id}')">✓ ${t('confirm_rdv')}</button>`;
  } else if(a.status==='confirmed'){
    actionsHTML = `
      <button class="pill-btn" onclick="closeModal()">${t('close')}</button>
      <button class="pill-btn danger" onclick="confirmDoctorAction('${a.id}','cancel')">✕ ${t('cancel')}</button>
      <button class="pill-btn primary" onclick="confirmDoctorAction('${a.id}','done')">✓ ${t('validate')}</button>`;
  } else {
    actionsHTML = `<button class="pill-btn" onclick="closeModal()">${t('close')}</button>`;
  }
  openModal(n.title, n.message, body, actionsHTML);
}

function renderAdminView(){
  switch(state.view){
    case 'adash': return viewAdminDash();

    case 'astats': return viewAdminStats();
    case 'arevenue': return viewAdminRevenue();
    case 'aappts': return viewAdminAppts();
    case 'alistes': return viewAdminListes();
    case 'asettings': return viewAdminSettings();

  }

function viewAdminStats(){
  const appts = DB.appointments.filter(a=>a.status!=='deleted');

        ${statTag(t('stats_avg_age'), (s.avgAge || '—') + ' ' + t('billing_years_old'), 'accent', true)}
        ${statTag(t('stats_total_revenue'), fmtDA(totalRev), 'money', true)}
      </div>

function printAdminStats(){

    .filter(x=>x.n>0).sort((a,b)=>b.n-a.n).slice(0,10)
    .map(x=>[x.d.name, x.n]);
  const wilayaCount = {};

    const doc = docById(a.doctorId);
    if(doc) wilayaCount[doc.wilaya] = (wilayaCount[doc.wilaya]||0)+1;

  const topWilayas = Object.entries(wilayaCount).sort((a,b)=>b[1]-a[1]).slice(0,10);
  const now = new Date().toLocaleString('fr-FR');
  const printDate = new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  const refNo = 'STATS-' + String(Date.now()).slice(-6) + '/' + new Date().getFullYear();

    if(!entries.length) return `<p class="nodata">${t('stats_no_data')}</p>`;
    const max = Math.max(1, ...entries.map(e=>e[1]));
    return entries.map(([lbl,val])=>`
      <div class="chart-row">
        <div class="chart-lbl" title="${esc(lbl)}">${esc(lbl)}</div>
        <div class="chart-bar-wrap"><div class="chart-bar" style="width:${Math.max((val/max)*100, 2)}%;background:${gradient}"></div></div>
        <div class="chart-val">${val}</div>
      </div>
    `).join('');
  }
  function tableRows(entries){
    if(!entries.length) return `<tr><td colspan="4" class="nodata-td">${t('stats_no_data')}</td></tr>`;

    return entries.map(([lbl,val],i)=>{
      const pct = total>0 ? ((val/total)*100).toFixed(1) : '0.0';

      return `<tr>

function addSpecialtyAdmin(){
  const inp = $('#newSpecialty'); if(!inp) return;
  const v = inp.value.trim();
  if(!v){ toast(t('required_fields'),'error'); return; }
  if(DB.specialties.includes(v)){ toast(t('item_exists'),'info'); return; }
  DB.specialties.push(v); saveDB(); render(); toast(t('item_added'),'success');
}
function deleteSpecialty(name){
  const used = DB.doctors.some(d=>d.specialty===name);
  if(used){ toast(t('cannot_delete_used'),'error'); return; }
  openModal('🗑️ '+t('specialties_list'), t('delete_item_confirm').replace('{name}', name), '',
    `<button class="pill-btn" onclick="closeModal()">${t('close')}</button>
     <button class="pill-btn danger" onclick="doDeleteSpecialty('${name.replace(/'/g,"\\'")}')">🗑️</button>`);
}
function doDeleteSpecialty(name){ DB.specialties = DB.specialties.filter(s=>s!==name); saveDB(); closeModal(); render(); toast(t('item_deleted'),'success'); }
function addWilayaAdmin(){
  const inp = $('#newWilaya'); if(!inp) return;
  const v = inp.value.trim();
  if(!v){ toast(t('required_fields'),'error'); return; }
  if(DB.wilayas.includes(v)){ toast(t('item_exists'),'info'); return; }
  DB.wilayas.push(v); if(!DB.communes[v]) DB.communes[v] = [];
  saveDB(); render(); toast(t('item_added'),'success');
}
function deleteWilaya(name){
  const used = DB.doctors.some(d=>d.wilaya===name);
  if(used){ toast(t('cannot_delete_used'),'error'); return; }
  openModal('🗑️ '+t('wilayas_list'), t('delete_item_confirm').replace('{name}', name), '',
    `<button class="pill-btn" onclick="closeModal()">${t('close')}</button>
     <button class="pill-btn danger" onclick="doDeleteWilaya('${name.replace(/'/g,"\\'")}')">🗑️</button>`);
}
function doDeleteWilaya(name){
  DB.wilayas = DB.wilayas.filter(w=>w!==name);
  delete DB.communes[name];
  if(state.listSelectedWilaya === name) state.listSelectedWilaya = DB.wilayas[0] || '';
  saveDB(); closeModal(); render(); toast(t('item_deleted'),'success');
}
function addCommuneAdmin(){
  const w = state.listSelectedWilaya; if(!w) return;
  const inp = $('#newCommune'); if(!inp) return;
  const v = inp.value.trim();
  if(!v){ toast(t('required_fields'),'error'); return; }
  if(!DB.communes[w]) DB.communes[w] = [];
  if(DB.communes[w].includes(v)){ toast(t('item_exists'),'info'); return; }
  DB.communes[w].push(v); saveDB(); render(); toast(t('item_added'),'success');
}
function deleteCommune(w, c){
  const used = DB.doctors.some(d=>d.wilaya===w && d.commune===c);
  if(used){ toast(t('cannot_delete_used'),'error'); return; }
  openModal('🗑️ '+t('communes_list'), t('delete_item_confirm').replace('{name}', c), '',
    `<button class="pill-btn" onclick="closeModal()">${t('close')}</button>
     <button class="pill-btn danger" onclick="doDeleteCommune('${w.replace(/'/g,"\\'")}','${c.replace(/'/g,"\\'")}')">🗑️</button>`);
}
function doDeleteCommune(w, c){
  if(DB.communes[w]) DB.communes[w] = DB.communes[w].filter(x=>x!==c);
  saveDB(); closeModal(); render(); toast(t('item_deleted'),'success');
}

function computeQuickRevenue(){
  const q = state.quickRev;
  let list = DB.appointments.filter(a=>a.status==='done');
  if(q.doctorId !== 'all') list = list.filter(a=>a.doctorId===parseInt(q.doctorId,10));
  let periodLabel = '';
  if(q.periodType === 'day'){
    if(!q.dayDate) return null;
    list = list.filter(a=>a.date === q.dayDate);
    periodLabel = fmtLongDate(q.dayDate);
  } else if(q.periodType === 'month'){
    const y = q.year || currentYear();
    const m = q.month || currentMonth();
    const key = `${y}-${String(m).padStart(2,'0')}`;
    list = list.filter(a=> a.date.startsWith(key));
    periodLabel = `${MONTH_NAMES[m-1]} ${y}`;
  } else {
    if(!q.startDate || !q.endDate) return null;
    list = list.filter(a=> a.date >= q.startDate && a.date <= q.endDate);
    periodLabel = `${fmtDate(q.startDate)} → ${fmtDate(q.endDate)}`;
  }
  list.sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
  const total = list.reduce((sum,a)=>sum+apptCommission(a),0);
  const docLabel = q.doctorId==='all' ? t('billing_all_doctors') : (docById(parseInt(q.doctorId,10))?.name || '—');
  return {list, total, periodLabel, docLabel};
}

function computeBillingData(){
  const b = state.billing;
  let list = DB.appointments.filter(a=>a.status==='done');
  if(b.doctorId !== 'all') list = list.filter(a=>a.doctorId===parseInt(b.doctorId,10));
  let periodLabel = '';
  if(b.periodType === 'day'){
    if(!b.dayDate) return null;
    list = list.filter(a=>a.date === b.dayDate);
    periodLabel = fmtLongDate(b.dayDate);
  } else if(b.periodType === 'month'){
    const y = b.year || currentYear();
    const m = b.month || currentMonth();
    const key = `${y}-${String(m).padStart(2,'0')}`;
    list = list.filter(a=> a.date.startsWith(key));
    periodLabel = `${MONTH_NAMES[m-1]} ${y}`;
  } else {
    if(!b.startDate || !b.endDate) return null;
    list = list.filter(a=> a.date >= b.startDate && a.date <= b.endDate);
    periodLabel = `${fmtDate(b.startDate)} → ${fmtDate(b.endDate)}`;
  }
  list.sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
  const total = list.reduce((s,a)=>s+apptCommission(a),0);
  const docLabel = b.doctorId==='all' ? t('billing_all_doctors') :
    (docById(parseInt(b.doctorId,10))?.name || '—');
  const totalWords = numberToFrenchWords(total) + ' ' + t('dinars');
  return {list, total, periodLabel, docLabel, totalWords};
}

function getInvoiceRegistryKey(doctorId, periodType, periodKey){
  return `${doctorId}_${periodType}_${periodKey}`;
}
function getPeriodKey(){
  const b = state.billing;
  if(b.periodType === 'day'){
    return b.dayDate || 'undefined';
  } else if(b.periodType === 'month'){
    const y = b.year || currentYear();
    const m = b.month || currentMonth();
    return `${y}_${String(m).padStart(2,'0')}`;
  } else {
    return `${b.startDate||'x'}_${b.endDate||'y'}`;
  }
}
function peekInvoiceNumber(){
  const b = state.billing;
  const key = getInvoiceRegistryKey(b.doctorId, b.periodType, getPeriodKey());
  if(DB.invoiceRegistry && DB.invoiceRegistry[key]) return DB.invoiceRegistry[key];
  return Object.keys(DB.invoiceRegistry || {}).length + 1;
}
function assignInvoiceNumber(){
  const b = state.billing;
  const key = getInvoiceRegistryKey(b.doctorId, b.periodType, getPeriodKey());
  if(!DB.invoiceRegistry) DB.invoiceRegistry = {};
  if(DB.invoiceRegistry[key]) return DB.invoiceRegistry[key];
  const next = Object.keys(DB.invoiceRegistry).length + 1;
  DB.invoiceRegistry[key] = next;
  saveDB();
  return next;
}
function formatInvoiceNumberFromCount(count){
  const year = new Date().getFullYear();
  const c = String(count).padStart(4, '0');
  return `${c} / ${year}`;
}

function viewAdminDoctors(){
  const q = (state.adminDoctorsSearch||'').trim().toLowerCase();
  let allDocs = DB.doctors.slice();
  if(q){
    allDocs = allDocs.filter(d=>{
      const hay = `${d.name} ${d.specialty} ${d.wilaya} ${d.commune} ${d.email} ${d.phone}`.toLowerCase();
      return hay.includes(q);
    });
  }
  const totalPages = Math.max(1, Math.ceil(allDocs.length / DOCTORS_PER_PAGE));
  const page = Math.min(state.adminDoctorsPage || 1, totalPages);
  const slice = allDocs.slice((page-1)*DOCTORS_PER_PAGE, page*DOCTORS_PER_PAGE);
  const btns = [];
  const maxBtns = 7;
  let start = Math.max(1, page - 3);
  let end = Math.min(totalPages, start + maxBtns - 1);
  if(end - start < maxBtns - 1) start = Math.max(1, end - maxBtns + 1);
  if(start > 1) btns.push(`<button class="page-btn" onclick="state.adminDoctorsPage=1;render()">1</button>`, start>2?`<span class="page-info">…</span>`:'');
  for(let p=start; p<=end; p++) btns.push(`<button class="page-btn ${p===page?'active':''}" onclick="state.adminDoctorsPage=${p};render()">${p}</button>`);
  if(end < totalPages) btns.push(end<totalPages-1?`<span class="page-info">…</span>`:'', `<button class="page-btn" onclick="state.adminDoctorsPage=${totalPages};render()">${totalPages}</button>`);
  return `
    <div class="card" style="margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
      <div>
        <div class="card-title" style="margin-bottom:0">🧑‍⚕️ ${t('manage_doctors')} <span class="tag accent">${DB.doctors.length}</span></div>

    ${slice.length ? slice.map(d=>{
      const apptCount = DB.appointments.filter(a=>a.doctorId===d.id && a.status!=='deleted').length;
      const servCount = servicesForDoctor(d.id).length;
      const days = (d.workDays||[]);
      const rating = getDoctorRating(d.id);
      return `
        <div class="admin-doc-row">
          <div class="doc-avatar">${d.avatar}</div>
          <div style="flex:1;min-width:200px">
            <div class="doc-name">${esc(d.name)}</div>
            <div class="doc-spec">${esc(d.specialty)} · ${esc(d.wilaya)}${d.commune?' · '+esc(d.commune):''}</div>
            <div class="doc-meta" style="margin-top:4px">
              <span>📞 ${esc(d.phone)}</span><span>✉️ ${esc(d.email)}</span>
              <span>${n2(d.fee)} DA</span><span>⏱️ ${d.duration} ${t('min')}</span>
            </div>
            <div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap">
              <span class="tag">📅 ${apptCount} RDV</span>
              ${servCount?`<span class="tag accent">💉 ${servCount}</span>`:''}
              ${rating.count>0?`<span class="tag rating">⭐ ${rating.avg} (${rating.count})</span>`:`<span class="tag rating-empty">⭐ —</span>`}
              <span class="tag muted">🔑 ${esc(d.password)}</span>

              ${days.length?`<span class="tag success">🗓️ ${days.map(i=>DAY_NAMES_SHORT[i]).join(' ')}</span>`:`<span class="tag danger">🗓️ —</span>`}

            <button class="mini-btn ghost" onclick="openDoctorProfile(${d.id})">👁️</button>
            <button class="mini-btn ghost" onclick="openDoctorForm(${d.id})">✏️</button>

            <button class="mini-btn red" onclick="confirmDeleteDoctor(${d.id})">🗑️</button>
          </div>
        </div>`;
    }).join('') : `<div class="empty"><div class="empty-ico">🧑‍⚕️</div>${t('no_docs')}</div>`}
    ${allDocs.length > DOCTORS_PER_PAGE ? `
      <div class="pagination">
        <button class="page-btn" ${page===1?'disabled':''} onclick="state.adminDoctorsPage=${page-1};render()">‹</button>
        ${btns.join('')}
        <button class="page-btn" ${page===totalPages?'disabled':''} onclick="state.adminDoctorsPage=${page+1};render()">›</button>
        <span class="page-info">${page} / ${totalPages} · ${allDocs.length}</span>
      </div>
    ` : ''}
  `;
}

  if(f.doctorId!=='all') list = list.filter(a=>a.doctorId===parseInt(f.doctorId,10));
  if(f.status!=='all') list = list.filter(a=>a.status===f.status);
  if(f.date) list = list.filter(a=>a.date===f.date);
  if(f.search){
    const q = f.search.toLowerCase();
    const qn = normPhone(q);
    list = list.filter(a=>{
      if((a.patientName||'').toLowerCase().includes(q)) return true;
      if(qn && normPhone(a.patientPhone).includes(qn)) return true;
      if((a.motif||'').toLowerCase().includes(q)) return true;
      if((a.id||'').toLowerCase().includes(q)) return true;
      if(a.patientAge && String(a.patientAge).includes(q)) return true;
      return false;
    });
  }
  list.sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
  const totalPages = Math.max(1, Math.ceil(list.length / APPTS_PER_PAGE));
  const page = Math.min(state.apptsPage || 1, totalPages);
  const slice = list.slice((page-1)*APPTS_PER_PAGE, page*APPTS_PER_PAGE);
  const fbtn = (v,lbl,cls) => `<button class="filter-btn ${cls} ${f.status===v?'active':''}" onclick="state.adminFilter.status='${v}';state.apptsPage=1;render()">${lbl}</button>`;
  return `
    <div class="card" style="margin-bottom:12px">
      <div class="field" style="margin-bottom:12px">
        <input class="input" id="adminApptSearch" placeholder="🔎 ${t('search_appt_admin_ph')}" value="${esc(f.search||'')}" oninput="state.adminFilter.search=this.value;state.apptsPage=1;render()">
      </div>
      <div class="grid grid-3">
        <select class="select" onchange="state.adminFilter.doctorId=this.value;state.apptsPage=1;render()">
          <option value="all">${t('filter_doctor')} — ${t('filter_all')}</option>
          ${DB.doctors.map(d=>`<option value="${d.id}" ${f.doctorId==d.id?'selected':''}>${esc(d.name)}</option>`).join('')}
        </select>
        <input class="input" type="date" value="${f.date}" onchange="state.adminFilter.date=this.value;state.apptsPage=1;render()">
        <button class="pill-btn danger" onclick="state.adminFilter={doctorId:'all',status:'all',date:'',search:''};state.apptsPage=1;render()">🗑️ Réinitialiser</button>
      </div>
      <div class="chips" style="margin-top:12px;margin-bottom:0">
        ${fbtn('all',t('filter_all'),'all')}
        ${fbtn('pending','⏳ '+t('status_pending'),'pending')}
        ${fbtn('confirmed','✓ '+t('status_confirmed'),'confirmed')}
        ${fbtn('cancelled','✕ '+t('status_cancelled'),'cancelled')}
        ${fbtn('done','✅ '+t('status_done'),'done')}
        ${fbtn('deleted','🗑️ '+t('status_deleted'),'deleted')}
      </div>
    </div>
    ${slice.length ? slice.map(a=>adminApptRow(a)).join('') : `<div class="empty"><div class="empty-ico">📅</div>${t('no_appts')}</div>`}
    ${list.length > APPTS_PER_PAGE ? renderPagination(page, totalPages, list.length) : ''}
  `;
}
function adminApptRow(a){

  return `
    <div class="appt ${isDeleted?'deleted':''} ${a.internal?'internal':''}">
      <div class="appt-time"><div class="h">${a.time}</div>
        <div class="d">${new Date(a.date+'T00:00:00').toLocaleDateString('fr-FR',{day:'2-digit',month:'short'})}</div>
      </div>
      <div class="appt-body">
        <div class="appt-patient">${esc(a.patientName)}${a.patientAge?` <span style="font-weight:400;color:var(--text-muted);font-size:11px">(${a.patientAge})</span>`:''} <span style="font-weight:400;color:var(--text-muted);font-size:11px">→ ${esc(doc?.name||'—')}</span></div>
        <div class="appt-meta">
          <span>${statusTag(a.status)}</span>
          ${a.internal?`<span class="tag internal">🗂️ ${t('internal_badge')}</span>`:''}
          <span>📞 ${esc(a.patientPhone)}</span>
          ${a.motif?`<span>📝 ${esc(a.motif)}</span>`:''}
          ${a.patientWilaya?`<span>🗺️ ${esc(a.patientWilaya)}</span>`:''}
          ${a.services&&a.services.length?`<span>💉 ${a.services.length}</span>`:''}
          ${a.rating && a.rating>0 ? `<span class="tag rating">⭐ ${a.rating}/5</span>` : ''}
          <span>🆔 ${a.id}</span>
        </div>
        ${cancelled?`
          <div style="margin-top:5px;padding:5px 8px;background:var(--danger-bg);border-radius:6px;font-size:11px;color:var(--danger);border-left:3px solid var(--danger)">
            <strong>❌ Motif d'annulation :</strong> ${esc(a.cancelReason)}
          </div>`:''}
      </div>
      <div class="appt-actions">
        ${!isDeleted ? `
          ${a.status==='pending'?`<button class="mini-btn green" onclick="confirmApptWithNotify('${a.id}')">✓ ${t('confirm_rdv')}</button>`:''}
          ${a.status==='confirmed'?`<button class="mini-btn purple" onclick="confirmDoctorAction('${a.id}','done')">✓ ${t('validate')}</button>`:''}
          ${(a.status==='pending'||a.status==='confirmed')?`<button class="mini-btn out-red" onclick="confirmDoctorAction('${a.id}','cancel')">✕ ${t('cancel')}</button>`:''}
          <button class="mini-btn red" onclick="confirmDeleteAppt('${a.id}')">🗑️</button>
        ` : `<span class="tag muted" style="font-size:10px">🗑️ ${t('status_deleted')}</span>`}
      </div>
    </div>
  `;
}

function qrSVG(seed){
  let h=0; for(const c of String(seed)) h=(h*31+c.charCodeAt(0))>>>0;
  const n=21; const cells=[];
  const rand=()=>{ h=(h*1664525+1013904223)>>>0; return h/4294967296; };
  for(let y=0;y<n;y++) for(let x=0;x<n;x++){
    const finder = (x<7&&y<7)||(x>=n-7&&y<7)||(x<7&&y>=n-7);
    let on;
    if(finder){
      const lx = x>=n-7 ? x-(n-7) : x;
      const ly = y>=n-7 ? y-(n-7) : y;
      on = (lx===0||lx===6||ly===0||ly===6) || (lx>=2&&lx<=4&&ly>=2&&ly<=4);
    } else on = rand()>0.55;
    if(on) cells.push(`<rect x="${x}" y="${y}" width="1" height="1" fill="#1f2937"/>`);
  }
  return `<svg viewBox="0 0 ${n} ${n}" xmlns="http://www.w3.org/2000/svg">${cells.join('')}</svg>`;
}
