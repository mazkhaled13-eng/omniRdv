<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OmniMed — Plateforme médicale</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg-gradient:linear-gradient(135deg,#e0c3fc 0%,#8ec5fc 50%,#fbc2eb 100%);
  --glass-bg:rgba(255,255,255,.65);--glass-bg-2:rgba(255,255,255,.45);--glass-bg-3:rgba(255,255,255,.3);
  --glass-border:rgba(255,255,255,.8);
  --accent-primary:#8b5cf6;--accent-primary-2:#7c3aed;--accent-light:#ede9fe;
  --text-main:#1f2937;--text-muted:#6b7280;
  --success:#10b981;--success-bg:#d1fae5;
  --danger:#ef4444;--danger-bg:#fee2e2;
  --warn:#f59e0b;--warn-bg:#fef3c7;
  --info-bg:#dbeafe;--info-text:#1d4ed8;
  --radius-sm:8px;--radius-md:12px;--radius-lg:20px;--radius-xl:28px;--radius-pill:9999px;
  --shadow:0 20px 40px rgba(0,0,0,.08);--shadow-sm:0 8px 20px rgba(0,0,0,.06);
  --transition:all .2s ease-in-out;
}
body.dark{
  --bg-gradient:linear-gradient(135deg,#1e1b4b 0%,#0f172a 50%,#2e1065 100%);
  --glass-bg:rgba(30,30,45,.6);--glass-bg-2:rgba(30,30,45,.4);--glass-bg-3:rgba(30,30,45,.25);
  --glass-border:rgba(255,255,255,.12);
  --accent-light:rgba(139,92,246,.2);
  --text-main:#f1f5f9;--text-muted:#94a3b8;
  --shadow:0 20px 40px rgba(0,0,0,.4);--shadow-sm:0 8px 20px rgba(0,0,0,.25);
  --info-bg:rgba(59,130,246,.2);--info-text:#93c5fd;
  --success-bg:rgba(16,185,129,.2);
  --danger-bg:rgba(239,68,68,.2);
  --warn-bg:rgba(245,158,11,.2);
}
html,body{height:100%}
body{font-family:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;
  background:var(--bg-gradient);background-attachment:fixed;color:var(--text-main);
  min-height:100vh;padding:20px;display:flex;justify-content:center;align-items:flex-start;
  transition:background .4s ease,color .3s ease;font-size:14px;line-height:1.5}
body[dir="rtl"]{direction:rtl}
.app{width:100%;max-width:1400px;height:calc(100vh - 40px);
  background:var(--glass-bg);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid var(--glass-border);border-radius:var(--radius-xl);
  box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.app-top{display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:14px 24px;border-bottom:1px solid var(--glass-border);
  background:var(--glass-bg-3);flex-shrink:0;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand-logo{width:40px;height:40px;border-radius:var(--radius-md);
  background:linear-gradient(135deg,var(--accent-primary),#ec4899);
  display:grid;place-items:center;color:#fff;font-size:19px;
  box-shadow:0 8px 16px rgba(139,92,246,.35)}
.brand-text{display:flex;flex-direction:column}
.brand-name{font-weight:700;font-size:16px;letter-spacing:-.3px}
.brand-sub{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.6px}
.title-block{flex:1;text-align:center;min-width:140px;padding:0 10px}
.page-title{font-size:17px;font-weight:700;letter-spacing:-.3px}
.page-sub{font-size:11.5px;color:var(--text-muted);margin-top:1px}
.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.app-nav{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:10px 20px;border-bottom:1px solid var(--glass-border);
  background:var(--glass-bg-2);flex-shrink:0;flex-wrap:wrap}
.nav-items{display:flex;gap:4px;flex-wrap:wrap;flex:1;min-width:0}
.nav-item{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;
  border-radius:var(--radius-md);cursor:pointer;color:var(--text-main);
  font-weight:500;font-size:13px;transition:var(--transition);
  border:1px solid transparent;background:transparent;font-family:inherit;white-space:nowrap}
.nav-item:hover{background:var(--glass-bg-3);border-color:var(--glass-border)}
.nav-item.active{background:var(--accent-light);color:var(--accent-primary);font-weight:600;border-color:var(--accent-light)}
.nav-item .ico{font-size:15px}
.nav-item .badge{margin-left:6px;background:var(--danger);color:#fff;font-size:10px;
  padding:1px 6px;border-radius:var(--radius-pill);font-weight:700}
body[dir="rtl"] .nav-item .badge{margin-left:0;margin-right:6px}
.nav-controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.role-menu{display:flex;gap:3px;background:var(--glass-bg-3);
  border:1px solid var(--glass-border);border-radius:var(--radius-md);padding:3px}
.role-btn{padding:7px 11px;border-radius:var(--radius-sm);border:none;
  background:transparent;cursor:pointer;font-family:inherit;
  font-size:15px;line-height:1;transition:var(--transition);color:var(--text-main)}
.role-btn:hover{background:var(--glass-bg)}
.role-btn.active{background:var(--accent-primary);color:#fff;box-shadow:0 4px 10px rgba(139,92,246,.3)}
.segmented{display:flex;gap:2px;background:var(--glass-bg-3);
  border:1px solid var(--glass-border);border-radius:var(--radius-pill);padding:3px}
.segmented button{padding:5px 11px;border-radius:var(--radius-pill);border:none;
  background:transparent;cursor:pointer;font-family:inherit;
  font-size:11.5px;font-weight:600;color:var(--text-muted);transition:var(--transition)}
.segmented button.active{background:var(--accent-primary);color:#fff}
.switch{position:relative;display:inline-block;width:52px;height:28px;cursor:pointer;flex-shrink:0}
.switch input{opacity:0;width:0;height:0}
.switch .slider{position:absolute;inset:0;background:var(--glass-bg-3);
  border:1px solid var(--glass-border);border-radius:var(--radius-pill);
  transition:var(--transition);display:flex;align-items:center}
.switch .slider::before{content:'';position:absolute;height:20px;width:20px;
  left:3px;top:3px;background:linear-gradient(135deg,var(--accent-primary),#ec4899);
  border-radius:50%;transition:var(--transition);
  box-shadow:0 2px 6px rgba(139,92,246,.4);z-index:1}
.switch input:checked + .slider::before{transform:translateX(24px)}
.switch .slider .ico{position:absolute;top:50%;transform:translateY(-50%);
  font-size:12px;pointer-events:none;z-index:2;transition:var(--transition)}
.switch .slider .ico-moon{left:7px;opacity:0}
.switch .slider .ico-sun{right:7px;opacity:1}
.switch input:checked + .slider .ico-moon{opacity:1}
.switch input:checked + .slider .ico-sun{opacity:0}
.content-wrap{flex:1;overflow-y:auto;padding:22px 26px}
.content-wrap::-webkit-scrollbar{width:8px}
.content-wrap::-webkit-scrollbar-thumb{background:var(--glass-border);border-radius:4px}
.card{background:var(--glass-bg);border:1px solid var(--glass-border);
  border-radius:var(--radius-lg);padding:20px;box-shadow:var(--shadow-sm);
  backdrop-filter:blur(12px);transition:var(--transition)}
.card:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.card-title{font-size:15px;font-weight:600;margin-bottom:4px;display:flex;
  align-items:center;gap:8px;flex-wrap:wrap}
.card-sub{font-size:12px;color:var(--text-muted);margin-bottom:14px}
.grid{display:grid;gap:14px}
.grid-2{grid-template-columns:repeat(2,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-4{grid-template-columns:repeat(4,1fr)}
@media(max-width:1000px){.grid-3,.grid-4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}}
.hero{background:linear-gradient(135deg,rgba(139,92,246,.18),rgba(236,72,153,.15));
  border:1px solid var(--glass-border);border-radius:var(--radius-xl);
  padding:24px;margin-bottom:20px;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:-40%;right:-10%;width:320px;height:320px;
  background:radial-gradient(circle,rgba(139,92,246,.35),transparent 70%);border-radius:50%}
.hero::after{content:'';position:absolute;bottom:-60%;left:-5%;width:280px;height:280px;
  background:radial-gradient(circle,rgba(236,72,153,.28),transparent 70%);border-radius:50%}
.hero-content{position:relative;z-index:1}
.hero h1{font-size:24px;font-weight:800;letter-spacing:-.5px;margin-bottom:4px}
.hero p{color:var(--text-muted);max-width:520px;margin-bottom:14px;font-size:13px}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap}
.input,.select,.textarea{width:100%;padding:10px 14px;background:var(--glass-bg-3);
  border:1px solid var(--glass-border);border-radius:var(--radius-md);
  color:var(--text-main);font-family:inherit;font-size:13.5px;
  transition:var(--transition);outline:none}
.input:focus,.select:focus,.textarea:focus{border-color:var(--accent-primary);
  box-shadow:0 0 0 4px rgba(139,92,246,.15);background:var(--glass-bg)}
.textarea{resize:vertical;min-height:70px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-size:12px;font-weight:600;color:var(--text-muted)}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:640px){.field-row{grid-template-columns:1fr}}
/* ===== Input + bouton sur la même ligne ===== */
.input-with-btn{display:flex;gap:8px;align-items:stretch;width:100%}
.input-with-btn .input{flex:1;min-width:0}
.input-with-btn .pill-btn{flex-shrink:0;white-space:nowrap}
.pill-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;
  border-radius:var(--radius-pill);background:var(--glass-bg-3);
  border:1px solid var(--glass-border);color:var(--text-main);
  font-family:inherit;font-size:12.5px;font-weight:500;cursor:pointer;
  transition:var(--transition);position:relative}
.pill-btn:hover{background:var(--accent-light);color:var(--accent-primary);border-color:var(--accent-light)}
.pill-btn.primary{background:var(--accent-primary);color:#fff;border-color:var(--accent-primary)}
.pill-btn.primary:hover{background:var(--accent-primary-2);color:#fff}
.pill-btn.success{background:var(--success);color:#fff;border-color:var(--success)}
.pill-btn.danger{background:var(--danger);color:#fff;border-color:var(--danger)}
.pill-btn.danger:hover{background:#dc2626;color:#fff}
.pill-btn .dot{position:absolute;top:-2px;right:-2px;width:10px;height:10px;border-radius:50%;
  background:var(--danger);border:2px solid var(--glass-bg)}
.mini-btn{padding:5px 9px;border-radius:var(--radius-sm);font-size:11px;font-weight:500;
  background:var(--glass-bg-3);border:1px solid var(--glass-border);
  cursor:pointer;color:var(--text-main);font-family:inherit;transition:var(--transition)}
.mini-btn:hover{background:var(--accent-light);color:var(--accent-primary);border-color:var(--accent-light)}
.mini-btn.ok:hover{background:var(--success-bg);color:var(--success)}
.mini-btn.no:hover{background:var(--danger-bg);color:var(--danger)}
.mini-btn.warn:hover{background:var(--warn-bg);color:var(--warn)}
.doc-card{background:var(--glass-bg);border:1px solid var(--glass-border);
  border-radius:var(--radius-lg);padding:16px;cursor:pointer;
  transition:var(--transition);display:flex;gap:14px;align-items:flex-start}
.doc-card:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--success)}
.doc-card.selected{border-color:var(--success);background:var(--success-bg);
  box-shadow:0 0 0 3px rgba(16,185,129,.2)}
.doc-avatar{width:56px;height:56px;border-radius:var(--radius-md);
  background:linear-gradient(135deg,var(--accent-light),#e0e7ff);
  display:grid;place-items:center;font-size:26px;flex-shrink:0;
  border:1px solid var(--glass-border)}
body.dark .doc-avatar{background:linear-gradient(135deg,rgba(139,92,246,.3),rgba(99,102,241,.2))}
.doc-info{flex:1;min-width:0}
.doc-name{font-weight:600;font-size:14.5px;margin-bottom:2px}
.doc-spec{font-size:12px;color:var(--accent-primary);font-weight:500;margin-bottom:4px}
.doc-meta{display:flex;gap:10px;flex-wrap:wrap;font-size:11.5px;color:var(--text-muted)}
.doc-meta span{display:flex;align-items:center;gap:4px}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;
  border-radius:var(--radius-pill);font-size:10.5px;font-weight:600;
  background:var(--info-bg);color:var(--info-text);border:1px solid transparent}
.tag.success{background:var(--success-bg);color:var(--success)}
.tag.danger{background:var(--danger-bg);color:var(--danger)}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.accent{background:var(--accent-light);color:var(--accent-primary)}
.tag.muted{background:var(--glass-bg-3);color:var(--text-muted)}
.tag.money{background:linear-gradient(135deg,#d1fae5,#a7f3d0);color:#065f46;font-weight:700}
body.dark .tag.money{background:rgba(16,185,129,.25);color:#6ee7b7}

/* ============================================================
   SLOTS — corrigé : selected a TOUJOURS la priorité
   ============================================================ */
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.slot{padding:9px 4px;border-radius:var(--radius-md);text-align:center;
  background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.35);
  cursor:pointer;font-size:12.5px;font-weight:600;transition:var(--transition);
  font-family:inherit;color:#065f46;
  text-decoration:none}
body.dark .slot{background:rgba(16,185,129,.16);color:#6ee7b7;border-color:rgba(16,185,129,.4)}
.slot:hover:not(:disabled){background:rgba(16,185,129,.24);color:#065f46;border-color:var(--success);transform:translateY(-1px)}
body.dark .slot:hover:not(:disabled){color:#6ee7b7}
/* SELECTED — spécificité renforcée + variante dark explicite */
.slot.selected,
body.dark .slot.selected,
body .slot.selected{
  background:var(--accent-primary) !important;
  color:#fff !important;
  border-color:var(--accent-primary) !important;
  box-shadow:0 4px 12px rgba(139,92,246,.45) !important;
  transform:translateY(-1px);
  text-decoration:none !important
}
.slot.selected:hover,
body.dark .slot.selected:hover{background:var(--accent-primary-2) !important;color:#fff !important}
/* DISABLED — pas de barré, rouge transparent */
.slot:disabled,
.slot[disabled]{
  opacity:.85;cursor:not-allowed;
  background:rgba(239,68,68,.14) !important;color:#b91c1c !important;
  border-color:rgba(239,68,68,.35) !important;
  text-decoration:none !important;
  -webkit-text-decoration:none !important;
  text-decoration-line:none !important;
  font-weight:600
}
body.dark .slot:disabled,
body.dark .slot[disabled]{
  background:rgba(239,68,68,.18) !important;color:#fca5a5 !important;
  border-color:rgba(239,68,68,.4) !important
}

/* ============================================================
   DATES — même correction
   ============================================================ */
.dates{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.date-chip{flex-shrink:0;padding:10px 12px;border-radius:var(--radius-md);
  text-align:center;background:rgba(16,185,129,.12);
  border:1px solid rgba(16,185,129,.35);
  cursor:pointer;min-width:62px;transition:var(--transition);
  font-family:inherit;color:#065f46;font-weight:600;text-decoration:none}
body.dark .date-chip{background:rgba(16,185,129,.16);color:#6ee7b7;border-color:rgba(16,185,129,.4)}
.date-chip:hover:not(.disabled):not(:disabled){background:rgba(16,185,129,.24);border-color:var(--success);color:#065f46;transform:translateY(-1px)}
body.dark .date-chip:hover:not(.disabled):not(:disabled){color:#6ee7b7}
.date-chip.selected,
body.dark .date-chip.selected{
  background:var(--accent-primary) !important;color:#fff !important;
  border-color:var(--accent-primary) !important;
  box-shadow:0 4px 12px rgba(139,92,246,.45) !important;
  text-decoration:none !important
}
.date-chip.selected:hover,
body.dark .date-chip.selected:hover{background:var(--accent-primary-2) !important;color:#fff !important}
.date-chip.disabled,
.date-chip:disabled{cursor:not-allowed;
  background:rgba(239,68,68,.12) !important;color:#b91c1c !important;
  border-color:rgba(239,68,68,.35) !important;opacity:.85;
  text-decoration:none !important}
body.dark .date-chip.disabled,
body.dark .date-chip:disabled{background:rgba(239,68,68,.16) !important;color:#fca5a5 !important}
.date-chip .d-day{font-size:10px;text-transform:uppercase;letter-spacing:.4px;opacity:.85}
.date-chip .d-num{font-size:16px;font-weight:700;line-height:1.2}
.date-chip .d-mon{font-size:10px;opacity:.85}

/* ============================================================
   WORK DAYS — rouge par défaut, VERT plein au clic
   Correction : variante body.dark .wday.on explicite
   ============================================================ */
.wday{min-width:56px;padding:9px 12px;font-size:12px;font-weight:700;
  border-radius:var(--radius-pill);
  border:1px solid rgba(239,68,68,.4);
  background:rgba(239,68,68,.14);color:#b91c1c;
  cursor:pointer;font-family:inherit;transition:var(--transition);
  display:inline-flex;align-items:center;justify-content:center;gap:4px}
body.dark .wday{background:rgba(239,68,68,.18);color:#fca5a5;border-color:rgba(239,68,68,.45)}
.wday:hover{background:rgba(239,68,68,.22);color:#b91c1c;transform:translateY(-1px)}
body.dark .wday:hover{color:#fca5a5}
/* ACTIF — spécificité renforcée + variante dark explicite */
.wday.on,
body.dark .wday.on,
body .wday.on{
  background:var(--success) !important;
  color:#fff !important;
  border-color:var(--success) !important;
  box-shadow:0 4px 12px rgba(16,185,129,.4) !important;
  text-decoration:none !important
}
.wday.on:hover,
body.dark .wday.on:hover{background:#059669 !important;color:#fff !important;transform:translateY(-1px)}

/* ============================================================
   APERÇU créneaux — clickable pour bloquer
   ============================================================ */
.slot-preview{display:flex;flex-wrap:wrap;gap:5px;padding:12px;
  background:var(--glass-bg-3);border-radius:var(--radius-md);
  border:1px dashed var(--glass-border);min-height:48px;align-items:center}
.pv-slot{padding:6px 10px;border-radius:var(--radius-pill);
  font-size:11.5px;font-weight:600;cursor:pointer;transition:var(--transition);
  border:1px solid rgba(16,185,129,.35);background:rgba(16,185,129,.12);color:#065f46;
  font-family:inherit;text-decoration:none}
body.dark .pv-slot{background:rgba(16,185,129,.16);color:#6ee7b7;border-color:rgba(16,185,129,.4)}
.pv-slot:hover{background:rgba(16,185,129,.24);transform:translateY(-1px)}
.pv-slot.off,
body.dark .pv-slot.off{
  background:rgba(239,68,68,.14) !important;color:#b91c1c !important;
  border-color:rgba(239,68,68,.35) !important;
  text-decoration:none !important;opacity:.9
}
body.dark .pv-slot.off{background:rgba(239,68,68,.18) !important;color:#fca5a5 !important}
.pv-hint{font-size:11px;color:var(--text-muted);margin-top:6px;display:flex;align-items:center;gap:6px}

.appt{background:var(--glass-bg);border:1px solid var(--glass-border);
  border-radius:var(--radius-md);padding:9px 12px;display:flex;gap:10px;
  align-items:center;transition:var(--transition);flex-wrap:wrap;margin-bottom:6px}
.appt:hover{box-shadow:var(--shadow-sm)}
.appt-time{display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-width:52px;padding:5px 6px;border-radius:var(--radius-sm);
  background:var(--accent-light);color:var(--accent-primary);flex-shrink:0}
.appt-time .h{font-size:12.5px;font-weight:700;line-height:1.1}
.appt-time .d{font-size:9px;text-transform:uppercase;letter-spacing:.3px;opacity:.85}
.appt-body{flex:1;min-width:0}
.appt-patient{font-weight:600;font-size:12.5px;margin-bottom:1px}
.appt-meta{font-size:10.5px;color:var(--text-muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.appt-actions{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.stat{background:var(--glass-bg);border:1px solid var(--glass-border);
  border-radius:var(--radius-lg);padding:14px;display:flex;gap:12px;align-items:center}
.stat-ico{width:42px;height:42px;border-radius:var(--radius-md);display:grid;place-items:center;
  font-size:19px;background:var(--accent-light);color:var(--accent-primary);flex-shrink:0}
.stat-val{font-size:20px;font-weight:800;letter-spacing:-.5px;line-height:1}
.stat-lbl{font-size:11px;color:var(--text-muted);margin-top:2px}
.stat.money .stat-ico{background:linear-gradient(135deg,#d1fae5,#a7f3d0);color:#065f46}
body.dark .stat.money .stat-ico{background:rgba(16,185,129,.25);color:#6ee7b7}
.stat.money .stat-val{color:#059669}
body.dark .stat.money .stat-val{color:#6ee7b7}
.notif-action{display:flex;gap:12px;padding:14px 16px;
  background:var(--glass-bg);border:1px solid var(--glass-border);
  border-radius:var(--radius-md);cursor:pointer;transition:var(--transition);margin-bottom:8px}
.notif-action:hover{background:var(--accent-light);border-color:var(--accent-primary);transform:translateX(3px)}
.notif-action.unread{border-left:3px solid var(--accent-primary)}

.notif-action:hover .na-arrow{color:var(--accent-primary);transform:translateX(2px)}
.modal-back{position:fixed;inset:0;background:rgba(15,23,42,.4);backdrop-filter:blur(6px);

.modal{background:var(--glass-bg);backdrop-filter:blur(20px);

@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}
.modal-title{font-size:17px;font-weight:700;margin-bottom:4px}
.modal-sub{font-size:12.5px;color:var(--text-muted);margin-bottom:16px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
#toasts{position:fixed;top:24px;right:24px;display:flex;flex-direction:column;gap:10px;z-index:200}
body[dir="rtl"] #toasts{right:auto;left:24px}
.toast{padding:12px 16px;border-radius:var(--radius-md);

.toast.info{border-left:3px solid var(--accent-primary)}
.empty{text-align:center;padding:40px 20px;color:var(--text-muted)}
.empty-ico{font-size:42px;margin-bottom:10px;opacity:.5}

.page-btn:disabled{opacity:.4;cursor:not-allowed}

let DB;
function loadDB(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    const parsed = raw ? JSON.parse(raw) : null;
    DB = (parsed && parsed.version===8) ? parsed : seedData();
  }catch(e){ DB = seedData(); }
  if(!DB.settings) DB.settings = {commission: COMMISSION_PER_RDV};
  if(!DB.wilayas) DB.wilayas = [...WILAYAS];
  if(!DB.communes) DB.communes = JSON.parse(JSON.stringify(COMMUNES));
  if(!DB.specialties || !DB.specialties.length) DB.specialties = [...DEFAULT_SPECIALTIES];
  DB.doctors.forEach(d=>{
    if(!d.workDays) d.workDays = [];
    if(!d.workStart) d.workStart = '08:00';
    if(!d.workEnd) d.workEnd = '17:00';
    if(!d.commune) d.commune = '';
    if(!d.disabledSlots) d.disabledSlots = [];
  });
}
function saveDB(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(DB)); }catch(e){} }

function toast(msg, type='info'){
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  const icons = {success:'✅',error:'⚠️',info:'ℹ️'};
  el.innerHTML = `<span>${icons[type]||''}</span><span>${esc(msg)}</span>`;
  $('#toasts').appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transform='translateX(20px)'; el.style.transition='all .3s'; setTimeout(()=>el.remove(),300); }, 3200);
}
function openModal(title, sub, bodyHTML, actionsHTML){
  $('#modal-root').innerHTML = `
    <div class="modal-back" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <div class="modal-title">${esc(title)}</div>
        ${sub?`<div class="modal-sub">${esc(sub)}</div>`:''}
        <div>${bodyHTML||''}</div>
        ${actionsHTML?`<div class="modal-actions">${actionsHTML}</div>`:''}
      </div>

function exportCSV(rows, filename){
  const csv = rows.map(r=>r.map(c=>`"${String(c??'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(['\ufeff'+csv], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download=filename; a.click(); URL.revokeObjectURL(url);
}
function generateSlots(workStart, workEnd, duration){
  const start = toMin(workStart||'08:00');
  const end = toMin(workEnd||'17:00');
  const step = duration||30;
  const out = []; let cur = start;
  while(cur + step <= end){ out.push(toHHMM(cur)); cur += step; }
  return out;
}
function slotsFor(doctorId, dateISO){
  const doc = docById(doctorId); if(!doc) return [];
  const disabled = doc.disabledSlots || [];
  const all = generateSlots(doc.workStart, doc.workEnd, doc.duration).filter(s=>!disabled.includes(s));
  const taken = DB.appointments.filter(a=>a.doctorId===doctorId && a.date===dateISO && a.status!=='cancelled').map(a=>a.time);
  return all.map(s=>({time:s, available:!taken.includes(s)}));
}
function next14Days(){ const out=[]; for(let i=0;i<14;i++) out.push(dateOffset(i)); return out; }
function isWorkDay(doc, dateISO){
  const dow = new Date(dateISO+'T00:00:00').getDay();
  return (doc.workDays||[]).includes(dow);
}
function dateHasAvail(doctorId, dateISO, period){
  const doc = docById(doctorId); if(!doc) return false;
  if(!isWorkDay(doc, dateISO)) return false;
  const slots = slotsFor(doctorId, dateISO).filter(s=>s.available);
  if(!slots.length) return false;
  if(!period) return true;
  return slots.some(s=>{ const h=parseInt(s.time.split(':')[0],10); return period==='morning'?h<12:h>=12; });
}
function pushNotif(role, title, message, toDoctorId, apptId){
  DB.notifications.unshift({id:uid('N-'), role, title, message, toDoctorId:toDoctorId||null, apptId:apptId||null, date:nowISO(), read:false});
  DB.notifications = DB.notifications.slice(0,80); saveDB();
}
function unreadCount(role, doctorId){
  return DB.notifications.filter(n=>n.role===role && (!doctorId || n.toDoctorId===doctorId) && !n.read).length;
}
function clearApptNotifications(apptId){
  DB.notifications = DB.notifications.filter(n => !(n.apptId === apptId && n.role === 'doctor'));
  saveDB();
}
function sendMessage(type, to, patientName, doctor, appt, custom){
  const body = custom || defaultMsg(patientName, doctor, appt, type);
  DB.messages.unshift({id:uid('M-'), type, to, subject: type==='email' ? 'OmniMed — Rendez-vous' : '', body, date:nowISO()});
  DB.messages = DB.messages.slice(0,120); saveDB(); return body;
}
function defaultMsg(patientName, doctor, appt, type){
  const date = fmtLongDate(appt.date);
  if(type==='email') return `Bonjour ${patientName},\n\nVotre rendez-vous avec ${doctor.name} (${doctor.specialty}) est prévu le ${date} à ${appt.time}.\nAdresse : ${doctor.address}.\nCode : ${appt.id}\n\n— OmniMed`;
  return `OmniMed: RDV chez ${doctor.name} le ${date} à ${appt.time}. Code: ${appt.id}.`;
}
function reminderMsg(patientName, doctor, appt){
  return `OmniMed: Rappel — RDV chez ${doctor.name} dans 2 heures (${appt.time}). Code: ${appt.id}.`;
}
function checkReminders(){
  const now = new Date();
  DB.appointments.forEach(a=>{
    if(a.status!=='confirmed') return;
    if(a.reminders?.h2) return;
    const dt = new Date(a.date+'T'+a.time+':00');
    const diff = (dt - now)/3600000;
    if(diff>0 && diff<=2){
      const doc = docById(a.doctorId); if(!doc) return;
      a.reminders = a.reminders||{}; a.reminders.h2 = true;
      pushNotif('doctor', t('reminder')+' H-2', `${a.patientName} — ${a.time}`, a.doctorId, a.id);
      pushNotif('patient', t('reminder')+' H-2', reminderMsg(a.patientName, doc, a), null, a.id);
      sendMessage('sms', a.patientPhone, a.patientName, doc, a, reminderMsg(a.patientName, doc, a));
    }
  });
  saveDB();
}

  const totalPages = Math.max(1, Math.ceil(list.length / APPTS_PER_PAGE));
  const page = Math.min(state.apptsPage || 1, totalPages);
  const slice = list.slice((page-1)*APPTS_PER_PAGE, page*APPTS_PER_PAGE);

  return `

  `;

function renderPagination(page, totalPages, totalItems){
  const maxBtns = 7;
  let start = Math.max(1, page - 3);
  let end = Math.min(totalPages, start + maxBtns - 1);
  if(end - start < maxBtns - 1) start = Math.max(1, end - maxBtns + 1);
  const btns = [];
  if(start > 1) btns.push(`<button class="page-btn" onclick="state.apptsPage=1;render()">1</button>`, start>2?`<span class="page-info">…</span>`:'');
  for(let p=start; p<=end; p++) btns.push(`<button class="page-btn ${p===page?'active':''}" onclick="state.apptsPage=${p};render()">${p}</button>`);
  if(end < totalPages) btns.push(end<totalPages-1?`<span class="page-info">…</span>`:'', `<button class="page-btn" onclick="state.apptsPage=${totalPages};render()">${totalPages}</button>`);
  return `
    <div class="pagination">
      <button class="page-btn" ${page===1?'disabled':''} onclick="state.apptsPage=${page-1};render()">‹ ${t('prev')}</button>
      ${btns.join('')}
      <button class="page-btn" ${page===totalPages?'disabled':''} onclick="state.apptsPage=${page+1};render()">${t('next_page')} ›</button>
      <span class="page-info">${page} / ${totalPages} · ${totalItems} RDV</span>
    </div>
  `;
}

    sendMessage('email', a.patientEmail, a.patientName, doc, a, `Bonjour ${a.patientName},\n\nVotre rendez-vous avec ${doc.name} du ${fmtLongDate(a.date)} à ${a.time} est CONFIRMÉ.\n\n— OmniMed`);
    sendMessage('sms', a.patientPhone, a.patientName, doc, a);
    toast('Rendez-vous confirmé','success');
  } else if(action==='cancel'){
    a.status='cancelled';
    pushNotif('patient','RDV annulé', `Votre RDV ${a.id} a été annulé par le médecin`, null, a.id);
    sendMessage('email', a.patientEmail, a.patientName, doc, a, `Bonjour ${a.patientName},\n\nVotre rendez-vous a été annulé.\n\n— OmniMed`);

      <div class="slots" id="postponeSlots">

          return `<button class="slot" ${disabled?'disabled':''} onclick="if(!this.disabled){document.querySelectorAll('#postponeSlots .slot').forEach(x=>x.classList.remove('selected'));this.classList.add('selected');window._postponeTime='${s.time}'}">${s.time}</button>`;
        }).join('')}

    <button class="pill-btn" onclick="closeModal()">${t('close')}</button>

  `);

function refreshPostponeSlots(id){
  const a = DB.appointments.find(x=>x.id===id); if(!a) return;
  const slots = slotsFor(a.doctorId, window._postponeDate);
  const cont = document.querySelector('#postponeSlots'); if(!cont) return;
  cont.innerHTML = slots.map(s=>{
    const isOriginal = (s.time===a.time && a.date===window._postponeDate);
    const disabled = !s.available && !isOriginal;
    return `<button class="slot" ${disabled?'disabled':''} onclick="if(!this.disabled){document.querySelectorAll('#postponeSlots .slot').forEach(x=>x.classList.remove('selected'));this.classList.add('selected');window._postponeTime='${s.time}'}">${s.time}</button>`;
  }).join('');
}
function doPostpone(id){
  const a = DB.appointments.find(x=>x.id===id); if(!a) return;
  const nd = window._postponeDate, nt = window._postponeTime;
  if(!nd || !nt){ toast('Choisissez une date et une heure','error'); return; }
  const clash = DB.appointments.find(x=>x.id!==id && x.doctorId===a.doctorId && x.date===nd && x.time===nt && x.status!=='cancelled');
  if(clash){ toast('Créneau déjà pris','error'); return; }
  const oldDate = a.date, oldTime = a.time;
  a.date = nd; a.time = nt;
  a.status = a.status==='pending' ? 'pending' : 'confirmed';
  a.rescheduledFrom = {date:oldDate, time:oldTime};
  const doc = docById(a.doctorId);
  pushNotif('patient','RDV reporté', `${fmtDate(nd)} ${nt}`, null, a.id);
  sendMessage('email', a.patientEmail, a.patientName, doc, a, `Bonjour ${a.patientName},\n\nVotre rendez-vous a été REPORTÉ :\nAncien : ${fmtLongDate(oldDate)} à ${oldTime}\nNouveau : ${fmtLongDate(nd)} à ${nt}\n\n— OmniMed`);
  sendMessage('sms', a.patientPhone, a.patientName, doc, a, `OmniMed: RDV reporté au ${fmtLongDate(nd)} à ${nt} chez ${doc.name}.`);
  clearApptNotifications(a.id);
  saveDB(); closeModal(); render(); toast('Rendez-vous reporté','success');
}
function noteModal(id){
  const a = DB.appointments.find(x=>x.id===id); if(!a) return;
  openModal(t('notes_doctor'), a.patientName, `
    <div class="field"><label>${t('note')}</label><textarea class="textarea" id="noteTxt">${esc(a.notes||'')}</textarea></div>
  `, `<button class="pill-btn" onclick="closeModal()">${t('close')}</button>
     <button class="pill-btn primary" onclick="saveNote('${id}')">${t('save')}</button>`);
}
function saveNote(id){
  const a = DB.appointments.find(x=>x.id===id); if(!a) return;
  a.notes = $('#noteTxt').value; saveDB(); closeModal(); render();
  toast('Note enregistrée','success');
}
function messageModal(id, type){
  const a = DB.appointments.find(x=>x.id===id); if(!a) return;
  const doc = docById(a.doctorId);
  const to = type==='email' ? a.patientEmail : a.patientPhone;
  const defaultBody = defaultMsg(a.patientName, doc, a, type);
  openModal(type==='email'?'✉️ '+t('send_email'):'💬 '+t('send_sms'), `${t('send_to')}: ${to||'—'}`, `
    ${type==='email'?`<div class="field"><label>${t('subject')}</label><input class="input" id="msgSubject" value="OmniMed — Votre rendez-vous"></div>`:''}
    <div class="field"><label>${t('message')}</label><textarea class="textarea" id="msgBody" style="min-height:140px">${esc(defaultBody)}</textarea></div>
  `, `<button class="pill-btn" onclick="closeModal()">${t('close')}</button>
     <button class="pill-btn primary" onclick="doSendMsg('${id}','${type}')">📤 ${t('send')}</button>`);
}
function doSendMsg(id, type){
  const a = DB.appointments.find(x=>x.id===id); if(!a) return;
  const to = type==='email' ? a.patientEmail : a.patientPhone;
  const body = $('#msgBody').value;
  const subject = $('#msgSubject')?.value || '';
  DB.messages.unshift({id:uid('M-'), type, to, subject, body, date:nowISO()});
  DB.messages = DB.messages.slice(0,120);
  saveDB(); closeModal();
  toast(type==='email'?t('email_sent'):t('sms_sent'),'success');
}
function viewDoctorWaitlist(){
  const doc = state.doctor;
  const list = DB.waitlist.filter(w=>w.doctorId===doc.id).sort((a,b)=>a.createdAt.localeCompare(b.createdAt));
  return `
    <div class="card" style="margin-bottom:14px">
      <div class="card-title">⏳ ${t('waitlist_title')} <span class="tag accent">${list.length}</span></div>
      <div class="card-sub">Patients en attente d'un créneau disponible</div>
    </div>
    ${list.length ? list.map(w=>`
      <div class="appt">
        <div class="appt-time" style="background:var(--warn-bg);color:var(--warn)">⏳</div>
        <div class="appt-body">
          <div class="appt-patient">${esc(w.patientName)}</div>
          <div class="appt-meta">
            <span>📞 ${esc(w.patientPhone)}</span><span>📅 ${fmtDate(w.preferredDate)}</span>
            ${w.patientEmail?`<span>✉️ ${esc(w.patientEmail)}</span>`:''}
          </div>
        </div>
        <div class="appt-actions">
          <button class="mini-btn" onclick="waitlistContact('${w.id}','email')">✉️</button>
          <button class="mini-btn" onclick="waitlistContact('${w.id}','sms')">💬</button>
          <button class="mini-btn no" onclick="removeWait('${w.id}')">✕</button>
        </div>
      </div>`).join('') : `<div class="empty"><div class="empty-ico">⏳</div>${t('waitlist_empty')}</div>`}
  `;
}
function waitlistContact(wid, type){
  const w = DB.waitlist.find(x=>x.id===wid); if(!w) return;
  const to = type==='email'? w.patientEmail : w.patientPhone;
  const body = type==='email' ? `Bonjour ${w.patientName},\n\nUn créneau s'est libéré prochainement.\n\n— OmniMed` : `OmniMed: Un créneau est disponible.`;
  DB.messages.unshift({id:uid('M-'), type, to, subject:type==='email'?'OmniMed — Créneau disponible':'', body, date:nowISO()});
  saveDB(); toast(type==='email'?t('email_sent'):t('sms_sent'),'success');
}
function removeWait(wid){
  DB.waitlist = DB.waitlist.filter(x=>x.id!==wid);
  saveDB(); render(); toast('Retiré de la file','info');
}

function changePwd(){
  const v = $('#newPwd').value;
  if(!v || v.length<4){ toast('4 caractères minimum','error'); return; }
  const doc = DB.doctors.find(x=>x.id===state.doctor.id);
  if(doc) doc.password = v;
  state.doctor.password = v; saveDB();
  toast('Mot de passe mis à jour','success');
}

function onWilayaChange(){
  const w = ($('#fWilaya')?.value||'').trim();
  const list = DB.communes[w] || [];
  const sel = $('#fCommune'); if(!sel) return;
  sel.disabled = !w;
  sel.style.opacity = w ? '1' : '.5';
  sel.innerHTML = `<option value="">${t('select_commune_ph')}</option>` + list.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');
}
function toggleWorkDay(day, btn){
  const idx = window._workDays.indexOf(day);
  if(idx >= 0){ window._workDays.splice(idx, 1); btn.classList.remove('on'); }
  else { window._workDays.push(day); btn.classList.add('on'); }
}
function updateSlotPreview(){
  const dur = parseInt($('#fDur')?.value,10)||30;
  const start = $('#fStart')?.value || '08:00';
  const end = $('#fEnd')?.value || '17:00';
  const slots = generateSlots(start, end, dur);
  const disabled = window._disabledSlots || [];
  const cont = document.querySelector('#slotPreview'); if(!cont) return;
  cont.innerHTML = slots.length
    ? slots.map(s=>{
        const off = disabled.includes(s);
        return `<button type="button" class="pv-slot ${off?'off':''}" onclick="togglePreviewSlot('${s}')">${s}</button>`;
      }).join('')
    : `<span style="color:var(--text-muted);font-size:12px">${t('no_slots')}</span>`;
}
function togglePreviewSlot(time){
  window._disabledSlots = window._disabledSlots || [];
  const idx = window._disabledSlots.indexOf(time);
  if(idx >= 0) window._disabledSlots.splice(idx,1);
  else window._disabledSlots.push(time);
  updateSlotPreview();
}
function saveDoctor(id, isSelf){
  isSelf = !!isSelf;
  const name = ($('#fName')?.value||'').trim();
  const specialty = ($('#fSpec')?.value||'').trim();
  const wilaya = ($('#fWilaya')?.value||'').trim();
  const commune = ($('#fCommune')?.value||'').trim();
  const address = ($('#fAddr')?.value||'').trim();
  const phone = ($('#fPhone')?.value||'').trim();
  const email = ($('#fEmail')?.value||'').trim();
  const fee = parseInt($('#fFee')?.value,10)||0;
  const duration = parseInt($('#fDur')?.value,10)||30;
  const pwd = ($('#fPwd')?.value||'').trim();
  const bio = ($('#fBio')?.value||'').trim();
  const avatar = window._pickedAvatar || '👨‍⚕️';
  const workStart = $('#fStart')?.value || '08:00';
  const workEnd = $('#fEnd')?.value || '17:00';
  const workDays = [...(window._workDays || [])].sort((a,b)=>a-b);
  const disabledSlots = [...(window._disabledSlots || [])];

  if(!name || !specialty || !wilaya || !commune || !pwd){ toast(t('required_fields'),'error'); return; }
  if(toMin(workStart) >= toMin(workEnd)){ toast('Heure de fin doit être après le début','error'); return; }
  if(!workDays.length){ toast('Sélectionnez au moins un jour de travail','error'); return; }

  if(!DB.specialties.includes(specialty)) DB.specialties.push(specialty);
  if(!DB.wilayas.includes(wilaya)) DB.wilayas.push(wilaya);
  if(!DB.communes[wilaya]) DB.communes[wilaya] = [];
  if(commune && !DB.communes[wilaya].includes(commune)) DB.communes[wilaya].push(commune);

  if(id){
    const d = DB.doctors.find(x=>x.id===id); if(!d) return;
    const commonFields = {name, specialty, wilaya, commune, address, phone, email, bio, avatar, workDays, workStart, workEnd, disabledSlots};
    if(isSelf){ Object.assign(d, commonFields, {password: pwd}); }
    else { Object.assign(d, commonFields, {fee, duration, password: pwd}); }
    if(state.doctor && state.doctor.id===id) state.doctor = d;
  } else {
    const newId = Math.max(0, ...DB.doctors.map(x=>x.id)) + 1;
    DB.doctors.push({id:newId, name, specialty, wilaya, commune, address, phone, email, fee, duration, password:pwd, bio, avatar, workDays, workStart, workEnd, disabledSlots});
  }
  saveDB(); closeModal(); render();
  toast(isSelf ? t('profile_saved') : t('doctor_saved'),'success');
}
function confirmDeleteDoctor(id){
  const d = docById(id); if(!d) return;
  const apptsN = DB.appointments.filter(a=>a.doctorId===id).length;
  const waitN = DB.waitlist.filter(w=>w.doctorId===id).length;
  openModal('🗑️ '+t('delete_doctor'), `${d.avatar} ${d.name}`,
    `<div style="font-size:13.5px;line-height:1.7">${t('delete_confirm')}</div>
     <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">
       <span class="tag danger">📅 ${apptsN} RDV</span><span class="tag warn">⏳ ${waitN} en attente</span>
     </div>`,
    `<button class="pill-btn" onclick="closeModal()">${t('close')}</button>
     <button class="pill-btn danger" onclick="deleteDoctor(${id})">🗑️ ${t('delete_doctor')}</button>`);
}
function deleteDoctor(id){
  DB.doctors = DB.doctors.filter(d=>d.id!==id);
  DB.appointments = DB.appointments.filter(a=>a.doctorId!==id);
  DB.waitlist = DB.waitlist.filter(w=>w.doctorId!==id);
  DB.notifications = DB.notifications.filter(n=>n.toDoctorId!==id);
  if(state.doctor && state.doctor.id===id) state.doctor = null;
  saveDB(); closeModal(); render();
  toast(t('doctor_deleted'),'success');
}
function openNotifDetail(notifId){
  const n = DB.notifications.find(x=>x.id===notifId); if(!n) return;
  n.read = true; saveDB();
  if(!n.apptId){ state.notifOpen = false; render(); return; }
  const a = DB.appointments.find(x=>x.id===n.apptId);
  if(!a){ DB.notifications = DB.notifications.filter(x=>x.id!==notifId); saveDB(); state.notifOpen=false; render(); return; }
  state.notifOpen = false;
  const doc = docById(a.doctorId);
  const body = `
    <div style="font-size:13px;line-height:2">
      <div><strong>${t('patient')} :</strong> ${esc(a.patientName)}</div>
      <div><strong>${t('phone')} :</strong> ${esc(a.patientPhone)}</div>
      ${a.patientEmail?`<div><strong>${t('email')} :</strong> ${esc(a.patientEmail)}</div>`:''}
      <div><strong>${t('doctor')} :</strong> ${esc(doc?.name||'—')}</div>
      <div><strong>${t('when')} :</strong> ${fmtLongDate(a.date)} — ${a.time}</div>
      <div><strong>${t('motif')} :</strong> ${esc(a.motif)}</div>
      <div style="margin-top:6px"><strong>Statut :</strong> ${statusTag(a.status)}</div>
    </div>
  `;
  let actionsHTML = '';
  if(a.status==='pending'){
    actionsHTML = `
      <button class="pill-btn" onclick="closeModal()">${t('close')}</button>
      <button class="pill-btn danger" onclick="docAction('${a.id}','cancel')">✕ ${t('cancel')}</button>
      <button class="pill-btn" onclick="closeModal();postponeModal('${a.id}')">🔁 ${t('postpone')}</button>
      <button class="pill-btn primary" onclick="docAction('${a.id}','confirm')">✓ ${t('validate')}</button>
    `;
  } else if(a.status==='confirmed'){
    actionsHTML = `
      <button class="pill-btn" onclick="closeModal()">${t('close')}</button>
      <button class="pill-btn danger" onclick="docAction('${a.id}','cancel')">✕ ${t('cancel')}</button>
      <button class="pill-btn" onclick="closeModal();postponeModal('${a.id}')">🔁 ${t('postpone')}</button>
      <button class="pill-btn primary" onclick="docAction('${a.id}','done')">✅ ${t('done')}</button>
    `;
  } else { actionsHTML = `<button class="pill-btn" onclick="closeModal()">${t('close')}</button>`; }
  openModal(n.title, n.message, body, actionsHTML);
}
function openNotifPanel(){
  const role = state.role;
  const docId = role==='doctor' ? state.doctor?.id : null;
  const list = DB.notifications.filter(n=>n.role===role && (!docId || n.toDoctorId===docId));
  const html = list.length ? list.slice(0,30).map(n=>{
    const a = n.apptId ? DB.appointments.find(x=>x.id===n.apptId) : null;
    const ico = n.apptId ? '📅' : '📩';
    return `
      <div class="notif-action ${n.read?'':'unread'}" onclick="openNotifDetail('${n.id}')">
        <div class="na-ico">${ico}</div>
        <div class="na-body">
          <div class="na-title">${esc(n.title)}</div>
          <div class="na-msg">${esc(n.message)}</div>
          ${a?`<div class="na-msg" style="color:var(--accent-primary);margin-top:3px">${fmtDate(a.date)} ${a.time}</div>`:''}
          <div class="na-time">${new Date(n.date).toLocaleString('fr-FR',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}</div>
        </div>
        <div class="na-arrow">›</div>
      </div>`;
  }).join('') : `<div class="empty" style="padding:30px">${t('no_notif')}</div>`;
  $('#modal-root').innerHTML = `
    <div class="modal-back" onclick="if(event.target===this){closeNotifs()}">
      <div class="modal" style="max-width:560px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
          <div class="modal-title">🔔 ${t('dnotif')}</div>
          <button class="mini-btn" onclick="markAllRead()">${t('mark_read')}</button>
        </div>
        <div style="max-height:65vh;overflow-y:auto">${html}</div>
        <div class="modal-actions"><button class="pill-btn" onclick="closeNotifs()">${t('close')}</button></div>
      </div>
    </div>`;
}
function markAllRead(){
  const role = state.role;
  const docId = role==='doctor'?state.doctor?.id:null;
  DB.notifications.forEach(n=>{ if(n.role===role && (!docId || n.toDoctorId===docId)) n.read=true; });
  saveDB(); state.notifOpen=false; render();
}

function renderAdminView(){
  if(!state.admin) return viewAdminLogin();
  switch(state.view){
    case 'adash': return viewAdminDash();
    case 'adoctors': return viewAdminDoctors();
    case 'arevenue': return viewAdminRevenue();
    case 'aappts': return viewAdminAppts();
    case 'awaitlist': return viewAdminWaitlist();
    case 'alistes': return viewAdminListes();
    case 'asettings': return viewAdminSettings();
    default: return viewAdminDash();
  }
}
function viewAdminLogin(){
  return `
    <div class="login-wrap">
      <div class="card">
        <div class="card-title">🔐 ${t('login_admin')}</div>
        <div class="card-sub">${t('login_admin_sub')}</div>
        <div class="field"><label>${t('username')}</label><input class="input" id="adminUser" value="admin"></div>
        <div class="field"><label>${t('password')}</label><input class="input" id="adminPwd" type="password" placeholder="••••"></div>
        <div style="font-size:11.5px;color:var(--text-muted);margin-bottom:14px">💡 ${t('hint_admin')}</div>
        <button class="pill-btn primary" style="width:100%;justify-content:center" onclick="doAdminLogin()">${t('sign_in')} →</button>
      </div>
    </div>
  `;
}
function doAdminLogin(){
  const u = $('#adminUser').value.trim();
  const p = $('#adminPwd').value;
  if(u === DB.admin.username && p === DB.admin.password){
    state.admin = {username:u}; state.view='adash'; render();
    toast('Bienvenue Admin','success');
  } else toast(t('invalid_login'),'error');
}
function logoutAdmin(){ state.admin=null; state.role='patient'; state.view='home'; render(); }

function viewAdminListes(){
  const tab = state.listTab || 'specialties';
  const tabs = `
    <div class="chips" style="margin-bottom:16px">
      <button class="chip ${tab==='specialties'?'active':''}" onclick="state.listTab='specialties';render()">🩺 ${t('specialties_list')} <span class="tag muted" style="margin-left:4px">${DB.specialties.length}</span></button>
      <button class="chip ${tab==='wilayas'?'active':''}" onclick="state.listTab='wilayas';render()">🗺️ ${t('wilayas_list')} <span class="tag muted" style="margin-left:4px">${DB.wilayas.length}</span></button>
      <button class="chip ${tab==='communes'?'active':''}" onclick="state.listTab='communes';render()">🏙️ ${t('communes_list')}</button>
    </div>
  `;
  if(tab==='specialties') return tabs + renderSpecialtiesManager();
  if(tab==='wilayas') return tabs + renderWilayasManager();
  return tabs + renderCommunesManager();
}

function addSpecialtyAdmin(){
  const inp = $('#newSpecialty'); if(!inp) return;
  const v = inp.value.trim();
  if(!v){ toast(t('required_fields'),'error'); return; }
  if(DB.specialties.includes(v)){ toast(t('item_exists'),'info'); return; }
  DB.specialties.push(v); saveDB(); render(); toast(t('item_added'),'success');
}
function deleteSpecialty(name){
  const used = DB.doctors.some(d=>d.specialty===name);
  if(used){ toast(t('cannot_delete_used'),'error'); return; }
  openModal('🗑️ '+t('specialties_list'), t('delete_item_confirm').replace('{name}', name), '',
    `<button class="pill-btn" onclick="closeModal()">${t('close')}</button>
     <button class="pill-btn danger" onclick="doDeleteSpecialty('${name.replace(/'/g,"\\'")}')">🗑️</button>`);
}
function doDeleteSpecialty(name){
  DB.specialties = DB.specialties.filter(s=>s!==name);
  saveDB(); closeModal(); render(); toast(t('item_deleted'),'success');
}
function addWilayaAdmin(){
  const inp = $('#newWilaya'); if(!inp) return;
  const v = inp.value.trim();
  if(!v){ toast(t('required_fields'),'error'); return; }
  if(DB.wilayas.includes(v)){ toast(t('item_exists'),'info'); return; }
  DB.wilayas.push(v); if(!DB.communes[v]) DB.communes[v] = [];
  saveDB(); render(); toast(t('item_added'),'success');
}
function deleteWilaya(name){
  const used = DB.doctors.some(d=>d.wilaya===name);
  if(used){ toast(t('cannot_delete_used'),'error'); return; }
  openModal('🗑️ '+t('wilayas_list'), t('delete_item_confirm').replace('{name}', name), '',
    `<button class="pill-btn" onclick="closeModal()">${t('close')}</button>
     <button class="pill-btn danger" onclick="doDeleteWilaya('${name.replace(/'/g,"\\'")}')">🗑️</button>`);
}
function doDeleteWilaya(name){
  DB.wilayas = DB.wilayas.filter(w=>w!==name);
  delete DB.communes[name];
  if(state.listSelectedWilaya === name) state.listSelectedWilaya = DB.wilayas[0] || '';
  saveDB(); closeModal(); render(); toast(t('item_deleted'),'success');
}
function addCommuneAdmin(){
  const w = state.listSelectedWilaya; if(!w) return;
  const inp = $('#newCommune'); if(!inp) return;
  const v = inp.value.trim();
  if(!v){ toast(t('required_fields'),'error'); return; }
  if(!DB.communes[w]) DB.communes[w] = [];
  if(DB.communes[w].includes(v)){ toast(t('item_exists'),'info'); return; }
  DB.communes[w].push(v); saveDB(); render(); toast(t('item_added'),'success');
}
function deleteCommune(w, c){
  const used = DB.doctors.some(d=>d.wilaya===w && d.commune===c);
  if(used){ toast(t('cannot_delete_used'),'error'); return; }
  openModal('🗑️ '+t('communes_list'), t('delete_item_confirm').replace('{name}', c), '',
    `<button class="pill-btn" onclick="closeModal()">${t('close')}</button>
     <button class="pill-btn danger" onclick="doDeleteCommune('${w.replace(/'/g,"\\'")}','${c.replace(/'/g,"\\'")}')">🗑️</button>`);
}
function doDeleteCommune(w, c){
  if(DB.communes[w]) DB.communes[w] = DB.communes[w].filter(x=>x!==c);
  saveDB(); closeModal(); render(); toast(t('item_deleted'),'success');
}
function viewAdminDash(){
  const totalDocs = DB.doctors.length;
  const totalAppts = DB.appointments.length;
  const pending = DB.appointments.filter(a=>a.status==='pending').length;
  const confirmed = DB.appointments.filter(a=>a.status==='confirmed').length;
  const cancelled = DB.appointments.filter(a=>a.status==='cancelled').length;
  const waitlistN = DB.waitlist.length;
  const patients = new Set(DB.appointments.map(a=>a.patientPhone)).size;
  const todayAppts = DB.appointments.filter(a=>a.date===todayISO() && a.status!=='cancelled');
  const docStats = DB.doctors.map(d=>({d, n: DB.appointments.filter(a=>a.doctorId===d.id).length})).sort((a,b)=>b.n-a.n).slice(0,5);
  const commission = getCommission();
  const billable = DB.appointments.filter(a=>a.status==='confirmed'||a.status==='done').length;
  const totalRev = billable * commission;
  const todayRev = DB.appointments.filter(a=>a.date===todayISO() && (a.status==='confirmed'||a.status==='done')).length * commission;
  return `
    <div class="grid grid-4" style="margin-bottom:18px">
      <div class="stat"><div class="stat-ico">🧑‍⚕️</div><div><div class="stat-val">${totalDocs}</div><div class="stat-lbl">${t('total_doctors')}</div></div></div>
      <div class="stat"><div class="stat-ico">👥</div><div><div class="stat-val">${patients}</div><div class="stat-lbl">${t('total_patients')}</div></div></div>
      <div class="stat"><div class="stat-ico" style="background:var(--success-bg);color:var(--success)">📅</div><div><div class="stat-val">${totalAppts}</div><div class="stat-lbl">${t('total_appts')}</div></div></div>
      <div class="stat"><div class="stat-ico" style="background:var(--warn-bg);color:var(--warn)">⏳</div><div><div class="stat-val">${waitlistN}</div><div class="stat-lbl">${t('waitlist_c')}</div></div></div>
    </div>
    <div class="grid grid-3" style="margin-bottom:18px">
      <div class="stat money"><div class="stat-ico">💰</div><div><div class="stat-val">${fmtDA(todayRev)}</div><div class="stat-lbl">${t('today_revenue')}</div></div></div>
      <div class="stat money"><div class="stat-ico">💵</div><div><div class="stat-val">${fmtDA(totalRev)}</div><div class="stat-lbl">${t('total_revenue')}</div></div></div>
      <div class="stat"><div class="stat-ico" style="background:var(--accent-light);color:var(--accent-primary)">⚙️</div><div><div class="stat-val">${commission} DA</div><div class="stat-lbl">${t('commission_per_rdv')}</div></div></div>
    </div>
    <div class="grid grid-3" style="margin-bottom:18px">
      <div class="stat"><div class="stat-ico" style="background:var(--warn-bg);color:var(--warn)">⏳</div><div><div class="stat-val">${pending}</div><div class="stat-lbl">${t('pending_c')}</div></div></div>
      <div class="stat"><div class="stat-ico" style="background:var(--success-bg);color:var(--success)">✓</div><div><div class="stat-val">${confirmed}</div><div class="stat-lbl">${t('confirmed_c')}</div></div></div>
      <div class="stat"><div class="stat-ico" style="background:var(--danger-bg);color:var(--danger)">✕</div><div><div class="stat-val">${cancelled}</div><div class="stat-lbl">${t('cancelled_c')}</div></div></div>
    </div>
    <div class="grid grid-2">
      <div class="card">
        <div class="card-title">📅 ${t('today_appts')} <span class="tag accent">${todayAppts.length}</span></div>
        <div style="margin-top:12px">
          ${todayAppts.length ? todayAppts.sort((a,b)=>a.time.localeCompare(b.time)).slice(0,6).map(a=>{
            const doc = docById(a.doctorId);
            return `
            <div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--glass-border);font-size:12.5px">
              <strong style="min-width:44px;color:var(--accent-primary)">${a.time}</strong>
              <span style="flex:1;font-weight:500">${esc(a.patientName)}</span>
              <span style="font-size:11px;color:var(--text-muted)">${esc(doc?.name||'')}</span>
              ${statusTag(a.status)}
            </div>`;
          }).join('') : `<div class="empty" style="padding:20px"><div class="empty-ico">🌤️</div>${t('no_appts')}</div>`}
        </div>
      </div>
      <div class="card">
        <div class="card-title">🏆 Top médecins</div>
        <div style="margin-top:12px;display:flex;flex-direction:column;gap:10px">
          ${docStats.map(({d,n})=>{
            const max = Math.max(1, docStats[0].n);
            return `
            <div style="display:flex;align-items:center;gap:10px;font-size:12.5px">
              <div style="width:32px;height:32px;border-radius:8px;background:var(--accent-light);display:grid;place-items:center;font-size:16px">${d.avatar}</div>
              <div style="flex:1;min-width:0">
                <div style="font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(d.name)}</div>

          }).join('')}

function viewAdminRevenue(){
  const p = state.revenuePeriod || 'month';
  const commission = getCommission();
  const today = todayISO();
  const weekStart = dateOffset(-6); const monthStart = dateOffset(-29);
  const billable = DB.appointments.filter(a=>a.status==='confirmed'||a.status==='done');
  const cntToday = billable.filter(a=>a.date===today).length;
  const cntWeek  = billable.filter(a=>a.date>=weekStart && a.date<=today).length;
  const cntMonth = billable.filter(a=>a.date>=monthStart && a.date<=today).length;
  const cntAll   = billable.length;
  let filtered = billable.slice();
  if(p==='day')   filtered = billable.filter(a=>a.date===today);
  if(p==='week')  filtered = billable.filter(a=>a.date>=weekStart && a.date<=today);
  if(p==='month') filtered = billable.filter(a=>a.date>=monthStart && a.date<=today);
  filtered.sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));
  const amount = filtered.length * commission;
  const byDoc = {};
  filtered.forEach(a=>{ byDoc[a.doctorId] = (byDoc[a.doctorId]||0)+1; });
  const docRows = Object.entries(byDoc).map(([id,n])=>{ const d = docById(parseInt(id,10)); return {d, n, amount:n*commission}; }).sort((a,b)=>b.n-a.n);
  const byDay = {};
  filtered.forEach(a=>{ byDay[a.date] = (byDay[a.date]||0)+1; });
  const dayRows = Object.entries(byDay).map(([date,n])=>({date, n, amount:n*commission})).sort((a,b)=>b.date.localeCompare(a.date));
  const chips = `
    <button class="chip ${p==='day'?'active':''}" onclick="setRevenuePeriod('day')">${t('day')}</button>
    <button class="chip ${p==='week'?'active':''}" onclick="setRevenuePeriod('week')">${t('week')}</button>
    <button class="chip ${p==='month'?'active':''}" onclick="setRevenuePeriod('month')">${t('month')}</button>
    <button class="chip ${p==='all'?'active':''}" onclick="setRevenuePeriod('all')">${t('all_period')}</button>
  `;
  return `
    <div class="grid grid-4" style="margin-bottom:18px">
      <div class="stat money"><div class="stat-ico">📅</div><div><div class="stat-val">${fmtDA(cntToday*commission)}</div><div class="stat-lbl">${t('today_revenue')}</div></div></div>
      <div class="stat money"><div class="stat-ico">📆</div><div><div class="stat-val">${fmtDA(cntWeek*commission)}</div><div class="stat-lbl">${t('week_revenue')}</div></div></div>
      <div class="stat money"><div class="stat-ico">🗓️</div><div><div class="stat-val">${fmtDA(cntMonth*commission)}</div><div class="stat-lbl">${t('month_revenue')}</div></div></div>
      <div class="stat money"><div class="stat-ico">💰</div><div><div class="stat-val">${fmtDA(cntAll*commission)}</div><div class="stat-lbl">${t('total_revenue')}</div></div></div>
    </div>
    <div class="card" style="margin-bottom:16px">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap">
        <div>
          <div class="card-title">💰 ${t('revenue_details')} <span class="tag money">${fmtDA(amount)}</span></div>
          <div class="card-sub" style="margin-bottom:0">${t('revenue_note')} — <strong>${commission} DA / RDV</strong></div>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="pill-btn" onclick="openCommissionRateModal()">⚙️ ${t('commission_per_rdv')}</button>
          <button class="pill-btn" onclick="printRevenueReport()">🖨️ ${t('print_report')}</button>
          <button class="pill-btn primary" onclick="printRevenueReport()">📄 ${t('export_pdf')}</button>
        </div>
      </div>
      <div class="chips" style="margin-top:14px;margin-bottom:0">
        <span style="font-size:11.5px;color:var(--text-muted);align-self:center;margin-right:6px">${t('period')}:</span>
        ${chips}
      </div>
    </div>
    <div class="tbl-wrap">
      <table class="tbl">
        <thead><tr>
          <th style="width:36px">#</th><th>${t('revenue_table_date')}</th><th>${t('revenue_table_time')}</th>
          <th>${t('revenue_table_patient')}</th><th>${t('revenue_table_doctor')}</th>
          <th>${t('revenue_table_specialty')}</th><th>${t('revenue_table_status')}</th>
          <th class="num">${t('revenue_table_commission')}</th>
        </tr></thead>
        <tbody>
          ${filtered.length ? filtered.map((a,i)=>{
            const doc = docById(a.doctorId);
            return `
            <tr>
              <td>${i+1}</td><td>${fmtDate(a.date)}</td><td><strong>${a.time}</strong></td>
              <td>${esc(a.patientName)}<div style="font-size:11px;color:var(--text-muted)">${esc(a.patientPhone)}</div></td>
              <td>${esc(doc?.name||'—')}</td><td>${esc(doc?.specialty||'—')}</td>
              <td>${statusTag(a.status)}</td>
              <td class="num"><strong style="color:#059669">+${commission} DA</strong></td>
            </tr>`;
          }).join('') : `<tr><td colspan="8"><div class="empty" style="padding:30px"><div class="empty-ico">💰</div>${t('revenue_no_data')}</div></td></tr>`}
        </tbody>
        ${filtered.length ? `<tfoot><tr>
          <td colspan="6">${t('revenue_total_rdv')} : <strong>${filtered.length}</strong></td>
          <td style="text-align:right">${t('revenue_total_amount')}</td>
          <td class="num" style="color:#059669;font-size:14px">${fmtDA(amount)}</td>
        </tr></tfoot>`:''}
      </table>
    </div>
    <div class="grid grid-2" style="margin-top:16px">
      <div class="card">
        <div class="card-title">🧑‍⚕️ ${t('report_by_doctor')}</div>
        <div style="margin-top:12px">
          ${docRows.length ? docRows.map(({d,n,amount})=>{
            const max = Math.max(1, docRows[0].n);
            return `
            <div style="display:flex;align-items:center;gap:10px;font-size:12.5px;padding:8px 0;border-bottom:1px solid var(--glass-border)">
              <div style="width:32px;height:32px;border-radius:8px;background:var(--accent-light);display:grid;place-items:center;font-size:16px">${d?.avatar||'?'}</div>
              <div style="flex:1;min-width:0">
                <div style="font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(d?.name||'—')}</div>
                <div class="bar" style="margin-top:4px"><div class="bar-fill" style="width:${(n/max)*100}%"></div></div>
              </div>
              <div style="text-align:right;min-width:90px">
                <div style="font-weight:700;color:#059669">${fmtDA(amount)}</div>
                <div style="font-size:10.5px;color:var(--text-muted)">${n} ${t('revenue_rdv_count')}</div>
              </div>
            </div>`;
          }).join('') : `<div class="empty" style="padding:20px">${t('revenue_no_data')}</div>`}
        </div>
      </div>
      <div class="card">
        <div class="card-title">📆 ${t('report_by_day')}</div>
        <div style="margin-top:12px;max-height:320px;overflow-y:auto">

function qrSVG(seed){
  let h=0; for(const c of String(seed)) h=(h*31+c.charCodeAt(0))>>>0;
  const n=21; const cells=[];
  const rand=()=>{ h=(h*1664525+1013904223)>>>0; return h/4294967296; };
  for(let y=0;y<n;y++) for(let x=0;x<n;x++){
    const finder = (x<7&&y<7)||(x>=n-7&&y<7)||(x<7&&y>=n-7);
    let on;
    if(finder){
      const lx = x>=n-7 ? x-(n-7) : x;
      const ly = y>=n-7 ? y-(n-7) : y;
      on = (lx===0||lx===6||ly===0||ly===6) || (lx>=2&&lx<=4&&ly>=2&&ly<=4);
    } else on = rand()>0.55;
    if(on) cells.push(`<rect x="${x}" y="${y}" width="1" height="1" fill="#1f2937"/>`);
  }
  return `<svg viewBox="0 0 ${n} ${n}" xmlns="http://www.w3.org/2000/svg">${cells.join('')}</svg>`;
}
